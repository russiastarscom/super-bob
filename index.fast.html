function bossKey(e) { return e.kind==='dragon' ? 'dra' : 'b' + worldOf(G.level); }
function drawEnemy(e) {
  const dx = (e.ix !== undefined ? e.ix : e.x) - camX, dy = (e.iy !== undefined ? e.iy : e.y);
  if (e.type==='crawler') {
    if (e.dead==='squish') cv2.drawImage(SPR.squish, dx, dy);
    else if (e.dead==='flip') { cv2.save(); cv2.translate(dx+7, dy+6); cv2.scale(1,-1); cv2.drawImage(SPR.crw1, -7, -6); cv2.restore(); }
    else cv2.drawImage(Math.floor(e.t*6)%2 ? SPR.crw1 : SPR.crw2, dx, dy);
  } else if (e.type==='shielder') {
    if (e.state==='walk') cv2.drawImage(e.dir>0 ? (Math.floor(e.t*6)%2?SPR.shd1L:SPR.shd2L)
                                                   : (Math.floor(e.t*6)%2?SPR.shd1:SPR.shd2), dx, dy);
    else cv2.drawImage(SPR.shield, dx, dy);
    if (e.dead==='flip') { cv2.save(); cv2.translate(dx+7,dy+5); cv2.scale(1,-1); cv2.drawImage(SPR.shield,-7,-5); cv2.restore(); }
  } else if (e.type==='shade') {
    if (e.dead==='flip') { cv2.save(); cv2.translate(dx+7,dy+4); cv2.scale(1,-1); cv2.drawImage(SPR.bat1,-7,-4); cv2.restore(); }
    else cv2.drawImage(Math.floor(e.t*8)%2 ? SPR.bat1 : SPR.bat2, dx, dy);
  } else if (e.type==='boss') drawBoss(e, dx, dy);
}
function drawBoss(e, dx, dy) {
  if (e.dead==='flip') { cv2.save(); cv2.translate(dx+e.w/2, dy+e.h/2); cv2.scale(1,-1);
    cv2.drawImage(SPR[bossKey(e)], -e.w/2, -e.h/2); cv2.restore(); return; }
  if (e.flash>0 && Math.floor(gTime*14)%2) return; // мигание после попадания
  const img = e.kind==='dragon' ? SPR[Math.floor(e.t*5)%2 ? 'drb' : 'dra'] : SPR[bossKey(e)];
  const isPriest = e.kind !== 'dragon' && [1,2,4].includes(worldOf(G.level)); // жрецы парят
  const float = isPriest ? 2 + Math.sin(e.t*2.4)*2 : 0;
  cv2.drawImage(img, dx, dy - float);
  const total = BOSS_KINDS[e.kind].hp;
  for (let i=0;i<total;i++) {
    cv2.fillStyle = i < e.hp ? '#ff5a2a' : 'rgba(255,255,255,.25)';
    cv2.fillRect(dx-2+i*6, dy-9, 5, 4);
  }
}
function drawPlayer() {
  // аксессуары поверх/позади спрайта в тех же координатах, что и сам спрайт
  const accDraw = (front, x, y) => {
    for (const id of Bank.d.aon) { const A = ACC_BY_ID[id]; if (!A) continue;
      if ((A.slot === 'back') === front) continue;   // back — за спиной, head/face — поверх
      cv2.drawImage(P.face < 0 ? A.imgL : A.img, x, y); } };
  const bobDraw = (spr, x, y) => { accDraw(false, x, y); cv2.drawImage(spr, x, y); accDraw(true, x, y); };
  // шарф позади героя — в цвете скина
  cv2.fillStyle = Bank.scarf();
  for (let i=1;i<=3;i++) { const s = P.trail[i*2] || P.trail[P.trail.length-1]; if (!s) break;
    cv2.fillRect(s.x-camX, s.y + Math.sin(gTime*9 + i*1.7)*1.6, 3, 2); }
  if (P.inv > 0 && Math.floor(gTime*16)%2) return; // неуязвимость: мерцание
  // звезда печати: радужная аура + искры; последние 2 сек — мигание
  if (P.starT > 0 && !(P.starT < 2 && Math.floor(gTime*9)%2)) {
    const hue = (gTime*300)%360|0, R = 15 + Math.sin(gTime*10)*2;
    cv2.save(); cv2.globalCompositeOperation = 'lighter';
    const gr = cv2.createRadialGradient(P.x+5-camX, P.y+P.h/2, 2, P.x+5-camX, P.y+P.h/2, R);
    gr.addColorStop(0, `hsla(${hue},100%,70%,.5)`); gr.addColorStop(1, 'hsla(0,0%,0%,0)');
    cv2.fillStyle = gr; cv2.beginPath(); cv2.arc(P.x+5-camX, P.y+P.h/2, R, 0, 7); cv2.fill();
    cv2.restore();
    for (let i=0;i<3;i++) { const a = gTime*7 + i*2.09;
      cv2.fillStyle = `hsl(${(hue+i*120)%360},100%,65%)`;
      cv2.fillRect(P.x+5-camX + Math.cos(a)*11 - 1, P.y+P.h/2 + Math.sin(a)*11 - 1, 2, 2); }
    try { cv2.filter = `hue-rotate(${hue}deg) saturate(1.4) brightness(1.12)`; } catch (e) {}
  }
  const prefix = P.big ? 'M' : 'm';
  let name;
  if (P.dying) name = 'm_jump';
  else if (P.slide) name = prefix+'_idle';
  else if (!P.grounded) name = prefix+'_jump';
  else if (P.pushT > 0) name = prefix+'_push';              // толкает камень: упёрся, руки вперёд
  else if (Math.abs(P.vx) > 8 || P.walkT>0) name = prefix + (Math.floor(P.animT*8)%2 ? '_run1' : '_run2');
  else name = prefix+'_idle';
  const spr = SPR[P.face<0 ? name+'L' : name];
  const pushWobble = P.pushT > 0 && !P.dying ? Math.round(Math.sin(gTime*16)*1) : 0;  // усилие толкания
  if (P.dying) { cv2.save(); cv2.translate(P.x-camX+5, P.y+8); cv2.rotate(Math.sin(P.deadT*10)*0.4); bobDraw(spr, -6, -8); cv2.restore(); }
  else if (Math.abs(P.squash) > 0.02) { // сквош-энд-стретч вокруг ступней
    const sy = 1 + P.squash*1.1, sx = 1 - P.squash*0.6;
    cv2.save(); cv2.translate(P.x-camX+5, P.y+P.h); cv2.scale(sx, sy);
    bobDraw(spr, -6 + pushWobble, -(P.big ? P.h : P.h+2)); cv2.restore();
  }
  else bobDraw(spr, P.x-1-camX + pushWobble, P.y - (P.big ? 0 : 2));
  if (P.starT > 0) { try { cv2.filter = 'none'; } catch (e) {} }  // снять радужный фильтр звезды
}
function drawSealFly() {
  const f = G.sealFly; f.t += 1/60;
  const tx = CFG.VW - 30 - Math.round(_safe.r) - (4 - G.seals.filter(Boolean).indexOf(true))*14, ty = 4 + Math.round(_safe.t);
  const k = Math.min(1, f.t/0.9), ease = k*k*(3-2*k);
  const x = lerp(f.x-camX, tx, ease), y = lerp(f.y, ty, ease) - Math.sin(k*Math.PI)*30;
  cv2.drawImage(SPR.seal, x, y);
  cv2.globalAlpha = 0.4; cv2.drawImage(SPR.seal, x-2+Math.random()*4, y-2+Math.random()*4); cv2.globalAlpha=1;
  if (k >= 1) G.sealFly = null;
}

/* ---------- HUD: два кластера с отступами от краёв экрана (вырезы/скругления
   не подрезают счёт и печати), позиции считаются по ширине текста — без наложений ---------- */
function drawHUD() {
  const W = CFG.VW, T = Math.round(_safe.t), Lm = Math.round(_safe.l), Rm = Math.round(_safe.r);
  cv2.fillStyle = 'rgba(0,0,0,.28)'; cv2.fillRect(0, 0, W, 22 + T);
  const ty = 6 + T;
  setFont(9);
  const mw = s => cv2.measureText(s).width;
  // ── левый кластер: счёт → монеты → ключ → таймер звезды
  const sTxt = `СЧЁТ ${String(G.score).padStart(6,'0')}`;
  const cTxt = `×${String(G.coins).padStart(2,'0')}`;
  let lx = 18 + Lm;                      // отступ от края: скругления экрана не режут счёт
  txt(sTxt, lx, ty, 9); lx += mw(sTxt) + 14;
  cv2.drawImage(SPR.coin0, lx, ty-2); lx += 13;
  txt(cTxt, lx, ty, 9); lx += mw(cTxt) + 12;
  if (G.hasKey) {
    cv2.drawImage(TILES.key, lx, ty-3, 16, 16); lx += 18;
    txt('КЛЮЧ', lx, ty, 8, '#ffd85a'); setFont(9); lx += mw('КЛЮЧ') + 10;
  }
  if (P.starT > 0) { // звезда печати: полоска оставшегося времени
    const w = Math.max(2, Math.round(30 * Math.min(1, P.starT / CFG.STAR_TIME)));
    cv2.fillStyle = 'rgba(0,0,0,.45)'; cv2.fillRect(lx, ty-2, w+8, 12);
    cv2.fillStyle = P.starT < 2 && Math.floor(gTime*6)%2 ? '#ffffff' : '#ffd800';
    cv2.fillRect(lx+2, ty, w, 8);
    cv2.drawImage(TILES.star, lx+w+4, ty-2, 10, 10);
    lx += w + 22;
  }
  // ── правый кластер (строим от правого края влево): печати → жизни → время → мир
  const tm = Math.max(0, Math.ceil(G.timeLeft));
  const lTxt = `ЖИЗНИ ×${G.lives}`, tTxt = `ВРЕМЯ ${tm}`;
  const wl = G.level >= LAST ? 'ФИНАЛ' : `МИР ${worldOf(G.level)+1}-${G.level%10+1}`;
  setFont(9);
  let rx = W - 18 - Rm;                  // и справа: звёзды-печати не касаются края экрана
  for (let i=4;i>=0;i--) { // печати: собранные — яркие
    cv2.globalAlpha = G.seals[i] ? 1 : 0.25;
    cv2.drawImage(SPR.seal, rx-12, ty-2, 12, 12); cv2.globalAlpha = 1;
    rx -= 14;
  }
  rx -= 8;
  if (Bank.d.rev > 0) {                    // перо феникса: запас возрождений рядом с жизнями
    cv2.drawImage(ART_BY_ID.phoenix.img, rx-12, ty-3, 11, 14);
    const rv = `×${Bank.d.rev}`;
    txt(rv, rx - 13, ty, 9, '#ffb040', 'right'); rx -= 13 + mw(rv) + 10;
  }
  txt(lTxt, rx, ty, 9, '#fff', 'right'); rx -= mw(lTxt) + 14;
  txt(tTxt, rx, ty, 9, tm<=60 && Math.floor(gTime*2)%2 ? '#ff5a5a' : '#fff', 'right'); rx -= mw(tTxt) + 14;
  if (rx - mw(wl) > lx + 8)                // мир — самый необязательный: рисуем, только если влезает
    txt(wl, rx, ty, 9, '#fff', 'right');
}

/* ---------- ЭКРАНЫ ---------- */
function menuItems() { const d = Save.data();

const MENU_Y = 118, ROW_H = 31, BTN_W = 248, BTN_H = 26;   // геометрия кнопок меню титула
function menuRowH(n) { return n > 4 ? 30 : ROW_H; }  // 5 пунктов — плотнее, чтобы не задать «ПОДДЕРЖАТЬ»
function menuTopY(n) { return n > 4 ? 104 : MENU_Y; }
function menuBtnRect(i) {                    // прямоугольник КНОПКИ пункта меню (для тапа — только по кнопке!)
  const n = menuItems().length;

function panel(x, y, w, h, r = 8) {          // скруглённая панель

  cv2.arcTo(x, y + h, x, y, r); cv2.arcTo(x, y, x + w, y, r); cv2.closePath();
}
const LOGO_RING = [[-3,0],[3,0],[0,-3],[0,3],[-2,-2],[2,-2],[-2,2],[2,2],[-3,2],[3,-2],[3,2],[-3,-2]];

  cv2.fillStyle = 'rgba(6,10,24,.8)'; panel(ab.x, ab.y, ab.w, ab.h, 6); cv2.fill();
  cv2.strokeStyle = 'rgba(255,216,0,.55)'; cv2.stroke();
  cv2.fillStyle = 'rgba(255,255,255,.10)'; cv2.fillRect(ab.x + 8, ab.y + 1.5, ab.w - 16, 1);
  txt('О ИГРЕ', ab.x + ab.w/2, ab.y + 5, 9, '#ffd800', 'center');
  /* ── МЕНЮ-КНОПКИ: каждый пункт — своя стеклянная кнопка; тап срабатывает
         ТОЛЬКО при попадании в саму кнопку (menuBtnRect), мимо — ничего.
         По просьбе автора лишние подзаголовки на кнопках убраны — осталась

  const items = menuItems(), n = items.length;
  const RHi = menuRowH(n), MY = menuTopY(n);       // 5 пунктов — колонка компактнее и выше
  const mcx = CFG.VW/2, mcy = MY + 4 + (n-1)*RHi/2;
  const mg = cv2.createRadialGradient(mcx, mcy, 12, mcx, mcy, 170);
  mg.addColorStop(0, 'rgba(255,216,0,.10)'); mg.addColorStop(1, 'rgba(255,216,0,0)');

    cv2.fillStyle = sel ? 'rgba(58,44,12,.94)' : 'rgba(6,10,24,.74)';
    panel(r.x, r.y, r.w, r.h, 9); cv2.fill();
    if (sel) {
      cv2.save(); panel(r.x, r.y, r.w, r.h, 9); cv2.clip();
      const bg = cv2.createLinearGradient(r.x, r.y, r.x, r.y + r.h);
      bg.addColorStop(0, 'rgba(255,216,0,.28)'); bg.addColorStop(1, 'rgba(255,154,42,.10)');
      cv2.fillStyle = bg; cv2.fillRect(r.x, r.y, r.w, r.h);
      cv2.restore();

   на соседний этаж хватает, а голова больше не бьётся: средние этажи —

   ↓+прыжок — провалиться вниз). Трубы-порталы у стен переносят на соседний
   этаж: влез в ЛЕВУЮ трубу — приехал на этаж ВЫШЕ справа, в ПРАВУЮ — на
   этаж НИЖЕ слева (сверху и снизу этажи замыкаются). Враги ходят по всем
   этажам. Собирай монеты-дорожки, прыгай врагам на голову, береги сердца.

   падают в общую копилку магазина. */
const ARENA_ROWS = [   // 32×18 тайлов = ровно один экран 512×288; этажи 2 и 3 — не тайлы,

  '#..............................#',
  '#..............................#',
  '#..............................#',

  '#..............................#',

/* сквозные платформы этажей 2 и 3: твёрдые только сверху (moveY их не видит,

   земля 256 → этаж 2 (176) → этаж 3 (96) → до потолка 80px воздуха. */

  { x:464, y:64,  floor:3 }];  // верх, правая
[[0,3],[2,5],[4,1]].forEach(pr => { ARN_PORTALS[pr[0]].p = pr[1]; ARN_PORTALS[pr[1]].p = pr[0]; });
for (const pt of ARN_PORTALS) {  // точка выхода из трубы: сбоку от пасти, к центру экрана
  if (pt.x < 32) { pt.ex = pt.x + 35; pt.ev = 46;  pt.ef = 1;  }

function arenaWave(n) {                // волна n: монеты заново, врагов больше и быстрее
  ARN.wave = n; ARN.banner = 2.4;
  for (const c of L.coins) c.taken = false;
  NET.ckChanged = true;                // в коопе гость узнает о сбросе монет из снимка
  L.enemies.length = 0;
  const sp = 1 + (n-1)*0.09;           // +9% к скорости врагов за волну
  const add = (type, x, surfY, a, b, d) => {
    const h = type==='crawler' ? 12 : type==='shielder' ? 11 : 8;
    const e = mkEnemy(type, x, surfY - h);
    e.id = ++NET.eid;                    // стабильный id для сетевой синхронизации
    e.dir = d; e.vx = Math.abs(e.vx || CFG.ENEMY.flyerSpd) * sp * d;
    e.a = a; e.b = b; e.active = true;               // границы патруля арены
    if (type === 'shade') e.baseY = e.y;
    L.enemies.push(e);
  };
  const F1 = 256, F2 = 176, F3 = 96;   // верхние кромки трёх этажей (зазоры по 80px)
  add('crawler', 96,  F1, 40, 472, -1);
  add('crawler', 352, F1, 120, 472, 1);
  add('crawler', 208, F2, 56, 456, -1);
  add('shielder', 304, F2, 56, 456, 1);
  add('crawler', 128, F3, 56, 296, 1);
  add('shade', 256, F3 - 64, 0, 512, -1);
  const extras = [                     // усиление волн: по одному новому врагу
    () => add('crawler', 400, F1, 240, 472, 1),
    () => add('shielder', 240, F2, 56, 456, -1),
    () => add('shade', 128, F3 - 70, 0, 512, 1),
    () => add('crawler', 320, F3, 264, 456, -1),
    () => add('crawler', 96,  F2, 56, 456, 1),
    () => add('shielder', 416, F1, 240, 472, -1)];
  for (let k = 0; k < Math.min(n-1, extras.length) && L.enemies.length < 12; k++) extras[k]();
  P.inv = Math.max(P.inv, 1.2);        // секунда на осмотрение после новой волны
  Sfx.music((n-1) % 5);                // своя тональность музыки на каждую волну
}

/* ---------- СЕТЬ АРЕНЫ: кооп на двоих через Supabase ----------
   Знакомит игроков сигнальный сервер Supabase Realtime (адрес проекта и
   ПУБЛИЧНЫЙ ключ — в supabase-config.js; ключ открытый по дизайну, пароль
   базы данных в игру не встраивается никогда).
   КАНАЛ = комната «bob5a-КОД», в ней три эшелона:
     1) presence  — «кто сейчас в комнате» (счётчик игроков в лобби);
     2) broadcast — знакомство: JOIN, OFFER, ANSWER, ICE, FULL, RHELLO/RACK;
     3) P2P WebRTC — игровые данные 60 Гц; если прямое соединение не
        открылось (сотовые операторы и строгие NAT часто режут P2P) —
        АВТОМАТИЧЕСКИ включается запасной путь: те же игровые пакеты ходят
        через broadcast-канал Supabase (релей, ~12 пакетов/с) — игра идёт
        всегда, просто чуть более плавная у одного и чуть менее у другого.
   Честные сообщения вместо «комната не найдена»: код проверяется и по
   presence (хост онлайн?), и по таблице rooms (если схемы развёрнуты).
   Отключение сети не ломает игру: Supabase не загрузился — сетевые кнопки
   честно пишут «сеть недоступна». Комната = 4-символьный код; третьему
   игроку хост вежливо отвечает «КОМНАТА ЗАНЯТА». */
const HAVE_SUPA = typeof supabase !== 'undefined';

  if (ARN.hearts > 0) {                // выбывшего враги не трогают,
    arenaPvpCheck();                   // а напарник может прыгнуть на голову

  ARN.camX = CFG.VW >= 512 ? 0 : clamp(P.x + 5 - CFG.VW/2, 0, 512 - CFG.VW);
  netGuestTick(dt);
}

function drawNetPlayer(gx, gy, o, tag) {   // чужой Боб: спрайт текущего скина + бирюзовая

    txt('ВЫ ВЫБЫЛИ — СЛЕДУЮЩАЯ ВОЛНА ВЕРНЁТ В СТРОЙ', CFG.VW/2, 70, 9, '#ffd800', 'center');
  { // частицы из пула движка (bobfx)

    cv2.globalAlpha = 1;

/* ---------- ВЫБОР УРОВНЯ: замки на непройденных, звёзды на пройденных ---------- */
const SEL_BACK = { x: 8, y: 8, w: 96, h: 22 };           // кнопка «в главное меню»
const TAB_NAMES = ['1', '2', '3', '4', '5', '6'];        // вкладки миров
function cardRect(i) {                       // прямоугольник карточки уровня i
  const page = worldOf(i), k = i - page*10;
  const cw = 60, chh = 44, gx = 10, gy = 10, cols = 5;
  const row = Math.floor(k/cols), col = k % cols;
  const gridW = cols*cw + (cols-1)*gx;
  return { x: CFG.VW/2 - gridW/2 + col*(cw+gx), y: 74 + row*(chh+gy), w: cw, h: chh };
}
function tabRect(w) {                        // вкладка мира w (0..5)
  const tw = 36, gap = 6, x0 = Math.round(CFG.VW/2 - (6*tw + 5*gap)/2);
  return { x: x0 + w*(tw+gap), y: 36, w: tw, h: 20 };
}
function selectHit(mx, my) {
  const page = G.selPage;
  for (let k = 0; k < 10; k++) {
    const i = page*10 + k; if (i >= MAPS.length) break;
    if (inRect(mx, my, cardRect(i))) return i;
  }
  return -1;
}

}

/* ---------- РЕКЛАМА на экране итогов: кнопка «Просмотр рекламы» = +25 монет ----------
   Одна большая кнопка: каждый тап открывает канал проекта (каналы чередуются:
   TG → MAX → TG…) и кладёт +25 в копилку. ЛИМИТ — 5 просмотров за итоги одного
   уровня: счётчик N/5 на карточке, после пятого карточка гаснет и показывает,
   сколько всего монет принесла реклама. Защита от случайного двойного тапа
   (0.9 с, в памяти). Тапы рядом с кнопкой НЕ листают экран «дальше» — зона
   рекламы защищена. */
const WIN_BONUS = 25;                                       // награда за один переход
const AD_LIMIT = 5;                                         // максимум просмотров рекламы за итоги уровня
const CHAN_LINKS = [                                        // каналы проекта (реклама)
  { label: 'КАНАЛ В TG', url: 'https://t.me/tw_you' },
  { label: 'КАНАЛ В MAX', url: 'https://max.ru/channel_twiin' }];
let lastAdTap = 0, adRotate = 0, adViews = 0;               // анти-даблтап + чередование + счётчик просмотров
function winBtnRect() {                     // большая кнопка рекламы под панелью итогов
  const w = 240, h = 32;
  return { x: Math.round(CFG.VW/2 - w/2), y: 245, w, h };
}
const AD_RET_KEY = 'bob5_ad_return';                        // метка «возврат с канала» для показа награды
function navAd(url) { try { window.location.href = url; } catch (e) {} }   // реклама открывается прямо в этом окне
function claimWinBonus() {
  if (G.adNavT > 0) return;                         // награда уже показывается — ждём переход
  const now = Date.now();
  if (now - lastAdTap < 900) return;                // двойной тап подряд — не награждаем
  if (adViews >= AD_LIMIT) {                        // максимум 5 просмотров за итоги уровня
    Sfx.bump(); note(`ЛИМИТ ПРОСМОТРОВ: ${AD_LIMIT}/${AD_LIMIT} — ЖМИ «ДАЛЬШЕ»!`, 2.6);
    return;
  }
  lastAdTap = now;
  adViews++;                                        // счётчик просмотров этого экрана итогов
  const ch = CHAN_LINKS[adRotate++ % CHAN_LINKS.length];
  Bank.earn(WIN_BONUS); Bank.flush();               // монеты — на диск до ухода со страницы
  Save.writeNext();                                 // «ПРОДОЛЖИТЬ» после возврата — следующий уровень
  try { localStorage.setItem(AD_RET_KEY, JSON.stringify({
    t: Date.now(), c: WIN_BONUS, n: adRotate })); } catch (e) {}   // после возврата покажем «+25 за рекламу»
  Sfx.star();
  G.adFxT = 0; G.adNavT = 1.0; G.adNavUrl = ch.url; // секунда на золотую анимацию «+25 МОНЕТ»
}

/* ---------- ПЕРЕХОДЫ СОСТОЯНИЙ ---------- */
function resetLevelStats() {   // статистика уровня — заново (смерти внутри уровня копятся)
  G.lvlTime = 0; G.lvlDeaths = 0; G.lvlCoins0 = G.coins; G.recorded = false;
}
function startCard(idx) {
  G.level = idx; parseLevel(idx); resetPlayer(true);
  resetLevelStats();
  autoFS();           // КАЖДЫЙ уровень на телефоне начинается на весь экран
  G.state = 'card'; G.cardT = 0; G.revT = 0; Sfx.stopMusic();
  Save.write();                       // автосохранение прогресса на входе в уровень
}
/* запуск уровня из меню выбора: свежая попытка, печати уже открытых миров светятся */
function launchLevel(idx) {
  autoFS();                     // на телефоне сразу разворачиваемся на весь экран
  G.score = 0; G.coins = 0; G.lives = CFG.START_LIVES;
  G.seals = [false,false,false,false,false];
  for (let w = 0; w < 5; w++) if (Prog.cleared(w*10+9)) G.seals[w] = true;
  startCard(idx);
}
function beginPlay() {
  G.state = 'play'; Sfx.music(G.level);
}
function beginAwaken() {
  G.state = 'awaken'; G.introPage = 0; G.revT = 0; Sfx.stopMusic();
}
function newGame() {
  Save.clear();
  autoFS();                     // новая кампания на телефоне — тоже на весь экран
  G.level = 0; G.seals = [false,false,false,false,false];
  G.score = 0; G.coins = 0; G.lives = CFG.START_LIVES;
  G.introPage = 0; G.revT = 0; G.state = 'intro'; Sfx.seal();
}
function restartAfterDeath() {
  G.lvlDeaths++;                      // считаем смерти для ★★ «без смертей»
  if (Bank.d.rev > 0) {               // ПЕРО ФЕНИКСА: заряд тратится — жизнь сохранена
    Bank.useRevive();
    G.timeLeft = CFG.LEVEL_TIME;
    parseLevel(G.level); resetPlayer(true);
    P.inv = 2.5;                      // секунды неуязвимости после возрождения
    Sfx.star(); note(`ФЕНИКС: ВОЗРОЖДЕНИЕ! ЗАПАС: ×${Bank.d.rev}`, 2.6);
    for (let i=0;i<14;i++) L.parts.push({x:P.x+5, y:P.y+8, vx:Math.cos(i/14*6.28)*100,
      vy:Math.sin(i/14*6.28)*100, t:0, life:0.6, col:'spark', s:2, grav:0.2});
    Sfx.music(G.level);
    return;
  }
  G.lives--;
  if (G.lives <= 0) { Bank.flush(); G.state = 'over'; Sfx.gameover(); return; }
  G.timeLeft = CFG.LEVEL_TIME;
  parseLevel(G.level); resetPlayer(true);
  Sfx.music(G.level);
}
function update(dt) {
  uiTime += dt;                                  // меню/подсказки анимируются в любом состоянии
  const ce = Keys.confirmEdge; Keys.confirmEdge = false;
  switch (G.state) {
    case 'title': {
      const items = menuItems();
      const n = items.length;
      if (!update.pL && Keys.left)  G.menuSel = (G.menuSel + n - 1) % n;
      if (!update.pR && Keys.right) G.menuSel = (G.menuSel + 1) % n;
      update.pL = Keys.left; update.pR = Keys.right;
      if (G.newConf && (Keys.pause || Keys.pauseEdge)) { G.newConf = false; Keys.pause = false; Keys.pauseEdge = false; }
      if (ce) {
        const label = items[Math.min(G.menuSel, n - 1)];
        if (label === 'ПРОДОЛЖИТЬ') { Save.read(); autoFS(); startCard(G.level); }
        else if (label === 'ВЫБОР УРОВНЯ') {
          G.state = 'select'; G.newConf = false;
          G.selSel = clamp(G.selSel, 0, Prog.maxUnlocked());
          G.selPage = worldOf(G.selSel);
        }
        else if (label === 'МАГАЗИН') { G.state = 'shop'; G.shopTab = 0; G.shopSel = SKINS.indexOf(Bank.skin()); }
        else if (label === 'АРЕНА') { Sfx.creak(); G.state = 'arenaMenu'; G.arnSel = 0; }
        else { // НОВАЯ ИГРА: с существующим прогрессом — с подтверждением
          if (Save.data() && !G.newConf) G.newConf = true;
          else { G.newConf = false; newGame(); }
        }
      }
      break; }
    case 'about':                        // «об игре»: Enter/Esc закрывают панель
      if (ce || Keys.pause || Keys.pauseEdge) { G.state = 'title'; Keys.pause = false; Keys.pauseEdge = false; Sfx.creak(); }
      break;
    case 'select': {
      const maxU = Prog.maxUnlocked();
      const prev = G.selSel;
      if (!update.pL && Keys.left)  G.selSel--;
      if (!update.pR && Keys.right) G.selSel++;
      if (!update.pU && Keys.jump)  G.selSel -= 5;   // ↑/W — на ряд вверх
      if (!update.pD && Keys.down)  G.selSel += 5;   // ↓/S — на ряд вниз
      update.pL = Keys.left; update.pR = Keys.right; update.pU = Keys.jump; update.pD = Keys.down;
      G.selSel = clamp(G.selSel, 0, maxU);
      if (G.selSel !== prev) { Sfx.creak(); G.selPage = worldOf(G.selSel); }   // страница следует за выбором
      if (ce) launchLevel(G.selSel);
      if (Keys.pause || Keys.pauseEdge) { G.state = 'title'; Keys.pause = false; Keys.pauseEdge = false; }
      break; }
    case 'shop': {                                   // магазин: вкладки скины/аксессуары/артефакты
      const list = G.shopTab === 0 ? SKINS : G.shopTab === 1 ? ACC : ARTS;
      const cols = G.shopTab === 2 ? 4 : 5, n = list.length;
      const selKey = G.shopTab === 0 ? 'shopSel' : G.shopTab === 1 ? 'accSel' : 'artSel';
      const prevS = G[selKey];
      let sel = prevS;
      if (!update.pL && Keys.left)  sel = (sel + n - 1) % n;
      if (!update.pR && Keys.right) sel = (sel + 1) % n;
      if (!update.pU && Keys.jump)  sel = (sel + n - cols) % n;   // ↑ — ряд вверх
      if (!update.pD && Keys.down)  sel = (sel + cols) % n;      // ↓ — ряд вниз
      if (sel !== prevS) { G[selKey] = sel; Sfx.creak(); }
      update.pL = Keys.left; update.pR = Keys.right; update.pU = Keys.jump; update.pD = Keys.down;
      if (Keys.shopTabEdge) {                      // Q — следующая вкладка (по кругу)
        Keys.shopTabEdge = false; G.shopTab = (G.shopTab + 1) % 3; Sfx.creak(); }
      if (Keys.pause || Keys.pauseEdge) { G.state = 'title'; Keys.pause = false; Keys.pauseEdge = false; }
      if (ce) {
        if (G.shopTab === 1) {
          const a = ACC[G.accSel];
          if (Bank.accOwn(a.id)) { Bank.accEquip(a.id); Sfx.unlockSnd();
            note(Bank.d.aon.includes(a.id) ? `НАДЕТО: ${a.name}` : `СНЯТО: ${a.name}`); }
          else if (Bank.buyAcc(a.id)) { Sfx.star(); note(`КУПЛЕНО: ${a.name}!`); }
          else { Sfx.bump(); note(`НЕ ХВАТАЕТ МОНЕТ — НУЖНО ${a.price}`); }
        } else if (G.shopTab === 2) {
          const a = ARTS[G.artSel];
          if (Bank.buyArt(a.id)) { Sfx.star();
            note(a.cons ? `ФЕНИКС: ЗАПАС ВОЗРОЖДЕНИЙ ×${Bank.d.rev}!` : `КУПЛЕНО: ${a.name} — АКТИВЕН!`); }
          else if (!a.cons && Bank.artOwn(a.id)) { Sfx.bump(); note(`УЖЕ АКТИВЕН: ${a.name}`); }
          else { Sfx.bump(); note(`НЕ ХВАТАЕТ МОНЕТ — НУЖНО ${a.price}`); }
        } else {
          const s = SKINS[G.shopSel];
          if (Bank.own(s.id)) { if (Bank.skin().id !== s.id) { Bank.setSkin(s.id); Sfx.unlockSnd(); note(`СКИН ВЫБРАН: ${s.name}`); } }
          else if (Bank.buy(s.id)) { Sfx.star(); note(`КУПЛЕНО: ${s.name}!`); }
          else { Sfx.bump(); note(`НЕ ХВАТАЕТ МОНЕТ — НУЖНО ${s.price}`); }
        }
      }
      break; }
    case 'results':
      G.resT += dt;
      if (G.adNavT > 0) {                  // идёт анимация награды — экран заблокирован до перехода
        G.adFxT += dt; G.adNavT -= dt;
        if (G.adNavT <= 0) { G.adNavT = 0; navAd(G.adNavUrl); }
        break;
      }
      if (Keys.pause || Keys.pauseEdge) {   // ESC — вернуться в главное меню
        Keys.pause = false; Keys.pauseEdge = false; G.state = 'title'; G.menuSel = 0; break;
      }
      if (ce && G.resT > 0.4) {                // пауза 0.4 с: двойной тап не проскакивает итоги
        if (G.level === LAST - 1) beginAwaken();       // за предпоследним — пробуждение
        else if (G.level < LAST - 1) startCard(G.level + 1);
        else { G.state = 'title'; G.menuSel = 0; }
      }
      break;
    case 'intro':
      if (Keys.pause || Keys.pauseEdge) { Keys.pause = false; Keys.pauseEdge = false; G.introPage = STORY.intro.length - 1; G.revT = 999; }
      else if (ce) { const pg = STORY.intro[G.introPage];
        if (G.revT*60 < pg.text.length) G.revT = 999;   // досказать страницу мгновенно
        else { G.introPage++; G.revT = 0;
          if (G.introPage >= STORY.intro.length) { G.level = 0;
            G.seals = [false,false,false,false,false]; G.score = 0; G.coins = 0;
            G.lives = CFG.START_LIVES;
            Save.clear();                                // новая кампания — старый прогресс стёрт
            startCard(0); } }
      }
      break;
    case 'card':
      G.cardT += dt; G.revT += dt;
      if (ce) { const pg = STORY.cards[G.level] || { text: '' };
        if (G.revT*60 < pg.text.length) G.revT = 999; else beginPlay(); }
      break;
    case 'play': {
      if (Keys.pause || Keys.pauseEdge) { G.state='pause'; G.pauseSel=0; Keys.pause=false; Keys.pauseEdge=false; break; }
      updateWorld(dt);
      if (P.dying && P.deadT > 2.4) restartAfterDeath();
      if (G.state==='play' && !Sfx.musicTimer && !P.dying) Sfx.music(G.level);
      break; }
    case 'arena':                        // режим «АРЕНА»: пакман-выживание на одном экране
      updateArena(dt, ce);
      break;
    case 'arenaMenu': {                  // лобби арены: один игрок / сеть
      const prevS = G.arnSel|0;
      if (!update.amU && Keys.jump) G.arnSel = (G.arnSel + 2) % 3;   // ↑/A — вверх
      if (!update.amD && Keys.down) G.arnSel = (G.arnSel + 1) % 3;   // ↓/S — вниз
      update.amU = Keys.jump; update.amD = Keys.down;
      if ((G.arnSel|0) !== prevS) Sfx.creak();
      if (Keys.pause || Keys.pauseEdge) {
        Keys.pause = false; Keys.pauseEdge = false;
        if (NET.wait) netClose();
        else if (NET.entering) netJoinHide();
        else { G.state = 'title'; G.menuSel = menuItems().indexOf('АРЕНА'); Sfx.creak(); }
        break;
      }
      if (ce && !NET.wait && !NET.entering) {
        const s = G.arnSel|0;
        if (s === 0) { Sfx.star(); netClose(); arenaStart(); }
        else if (s === 1) { Sfx.star(); netHost(); }
        else { Sfx.creak(); netJoinShow(); }
      }
      break; }
    case 'pause': {                    // меню паузы: ПРОДОЛЖИТЬ / ЗАНОВО / В МЕНЮ
      const n = PAUSE_ITEMS.length, prev = G.pauseSel;
      if (!update.pU && Keys.jump && !ce) G.pauseSel = (G.pauseSel + n - 1) % n;   // A на таче = «принять», не «вверх»
      if (!update.pD && Keys.down)  G.pauseSel = (G.pauseSel + 1) % n;
      if (!update.pL && Keys.left)  G.pauseSel = (G.pauseSel + n - 1) % n;
      if (!update.pR && Keys.right) G.pauseSel = (G.pauseSel + 1) % n;
      update.pU = Keys.jump; update.pD = Keys.down; update.pL = Keys.left; update.pR = Keys.right;
      if (G.pauseSel !== prev) Sfx.creak();
      if (Keys.pause || Keys.pauseEdge) {          // P/ESC — быстрое продолжение
        G.state='play'; Keys.pause=false; Keys.pauseEdge=false; break; }
      if (ce) activatePauseItem();
      break; }
    case 'clear':
      G.clearT += dt; updateWorld(dt);
      if (P.dying && P.deadT > 2.4) restartAfterDeath();   // смерть на прогулке к замку не подвешивает уровень
      if (G.clearPhase>=2 && ce) { G.state = 'results'; G.resT = 0; adViews = 0; }  // дальше — итоги (лимит просмотров обновляется)
      break;
    case 'awaken':
      G.revT += dt;
      if (Keys.pause || Keys.pauseEdge) { Keys.pause = false; Keys.pauseEdge = false; G.introPage = STORY.awaken.length - 1; G.revT = 999; }
      else if (ce) { const pg = STORY.awaken[G.introPage];
        if (G.revT*60 < pg.text.length) G.revT = 999;
        else { G.introPage++; G.revT = 0;
          if (G.introPage >= STORY.awaken.length) startCard(LAST); } }
      break;
    case 'over':
      if (ce) {
        G.lives = CFG.START_LIVES;
        if (Save.data()) { Save.read(); }        // продолжаем с автосохранения
        parseLevel(G.level); resetPlayer(true);
        resetLevelStats();
        G.state='card'; G.revT=0; G.cardT=0;
      }
      break;
    case 'final':
      G.revT += dt;
      if (ce) { const pg = STORY.final[Math.min(renderFinal.pg|0, STORY.final.length-1)];
        if (G.revT*60 < pg.length) G.revT = 999;
        else if (renderFinal.pg < STORY.final.length-1) { renderFinal.pg++; G.revT = 0; }
        else { renderFinal.pg = 0; renderFinal.conf = null; G.revT = 0; G.state='title'; G.menuSel = 0; } }
      break;
  }
  Keys.confirm = false;
}
function render() {
  cv2.setTransform(1,0,0,1,0,0);
  if (shakeT > 0 && (G.state==='play' || G.state==='clear' || G.state==='pause'))
    cv2.setTransform(1,0,0,1, (Math.random()-.5)*2*shakeA, (Math.random()-.5)*2*shakeA);
  switch (G.state) {
    case 'title': renderTitle(); break;
    case 'about': renderAbout(); break;
    case 'select': renderSelect(); break;
    case 'shop': renderShop(); break;
    case 'intro': renderIntro(); break;
    case 'card':  renderCard(); break;
    case 'play':  renderWorld(); drawHUD(); break;
    case 'arena': renderArena(); break;
    case 'arenaMenu': renderArenaMenu(); break;
    case 'pause': renderPause(); break;
    case 'clear': renderClear(); drawHUD(); break;
    case 'results': renderResults(); break;
    case 'over':  renderOver(); break;
    case 'awaken': renderAwaken(); break;
    case 'final': renderFinal(); break;
  }
  cv2.setTransform(1,0,0,1,0,0);
  let hy = CFG.VH - 14;   // индикатор внизу справа (звук выключен)
  if (Sfx.muted) { txt('ЗВУК ВЫКЛ (M)', CFG.VW-8, hy, 8, 'rgba(255,255,255,.6)', 'right'); hy -= 11; }
  // всплывающая подсказка (автосохранение, время и т.п.)
  if (G.note && G.note.t > 0) {
    const t = G.note;
    setFont(8);                          // шрифт для замера ширины плашки
    const w = Math.min(CFG.VW - 24, cv2.measureText(t.txt).width + 16);
    const ny = (G.state==='play' || G.state==='pause' || G.state==='clear' || G.state==='over') ? 30 : 250;  // в меню — снизу, не поверх шапок
    cv2.globalAlpha = clamp(t.t / 0.4, 0, 1);
    cv2.fillStyle = 'rgba(0,0,0,.82)'; cv2.fillRect(CFG.VW/2 - w/2, ny, w, 18);
    cv2.strokeStyle = 'rgba(255,255,255,.35)'; cv2.strokeRect(CFG.VW/2 - w/2 + .5, ny + .5, w - 1, 17);
    txt(t.txt, CFG.VW/2 - (w - 16)/2, ny + 7, 8, '#ffd800', 'left');
    cv2.globalAlpha = 1;
  }
  // баннер вступления босса
  if (G.state==='play' && G.bossBannerT > 0) {
    const k = Math.min(1, (3.4 - G.bossBannerT) / 0.3);
    cv2.globalAlpha = 0.62 * k;
    cv2.fillStyle = '#000'; cv2.fillRect(0, 104, CFG.VW, 44);
    cv2.globalAlpha = k;
    const name = BOSS_INFO[G.level >= LAST ? 5 : worldOf(G.level)];
    txt(name, CFG.VW/2, 118, 13, '#ffd800', 'center');
    txt('— ХРАНИТЕЛЬ ПЕЧАТИ —', CFG.VW/2, 134, 8, 'rgba(255,255,255,.7)', 'center');
    cv2.globalAlpha = 1;
  }
}

/* ---------- ГЛАВНЫЙ ЦИКЛ (фиксированный шаг 1/60) ---------- */
let last = performance.now(), acc = 0;
let fpsN = 0, fpsT = 0, fpsVal = 60;          // FPS-монитор (для QA-теста производительности)
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  dt = Math.min(dt, 0.1); acc += dt;
  const STEP = 1/60;
  let guard = 5;                              // потолок шагов физики за кадр — против «спирали смерти»
  while (acc >= STEP && guard-- > 0) { update(STEP); acc -= STEP; }
  if (acc > STEP) acc = 0;                    // не успеваем — сбрасываем накопитель, без лага
  fpsN++; fpsT += dt;
  if (fpsT >= 0.5) { fpsVal = Math.round(fpsN / fpsT); fpsN = 0; fpsT = 0; }
  // подсказки тикают в ЛЮБОМ экране (меню, магазин, лобби) — иначе «не хватает
  // монет» и «напарник отключился» висят вечно, пока экран не сменится
  if (G.note) { G.note.t -= dt; if (G.note.t <= 0) G.note = null; }
  // экранные кнопки — только в геймплее (игра, пауза, финишный выход)
  touchEl.classList.toggle('show', G.state==='play' || G.state==='pause' || G.state==='clear' || G.state==='arena');
  // полный экран игра сама не выключает НИКОГДА — включается тапом по экрану
  render();
}
(function bootWhenEngReady() {         // первый кадр — после выбора движка (WASM или JS)
  const go = () => requestAnimationFrame(frame);
  (window.ENG && ENG.ready ? ENG.ready.then(go, go) : go());
})();

/* ---------- ПОЛНЫЙ ЭКРАН: ЛЮБОЙ ТАП, БЕЗ КНОПКИ И БЕЗ ВЫХОДА ----------
   ГЛАВНОЕ ПРАВИЛО: полный экран включается ЛЮБЫМ ТАПОМ/КЛИКОМ по экрану
   (в любом месте, в любом меню, на телефоне и на компьютере) и САМ НИКОГДА
   не выключается. Кнопки полного экрана нет, пути выхода из полного экрана
   в игре нет. При открытии игры растягиваемся сразу: настоящий ФС без жеста
   браузеры отклоняют — тогда включается псевдо-режим, и первый же тап
   добивает до настоящего полного экрана. */
const FSROOT = document.documentElement;
let fsExitT = 0;                        // когда игрок сам вышел из полного экрана (Esc)
function isFS() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function fsOn() { return isFS() || document.body.classList.contains('pfs'); }   // настоящий или псевдо (iOS)
function enterFS() {                      // ТОЛЬКО вход; выхода из полного экрана нет
  if (isFS()) return;                     // настоящий ФС уже включён
  /* ТИХИЙ РЕЖИМ: браузер отклоняет requestFullscreen без свежего жеста игрока
     (открытие страницы, автоповтор после Esc) — и печатает ошибку в консоль.
     Не дёргаем его зря: без жеста молча включаем псевдо-режим (pfs), первый же
     тап добьёт до настоящего полного экрана. */
  const act = navigator.userActivation;
  if ((act && !act.isActive) || Date.now() - fsExitT < 2000) {
    document.body.classList.add('pfs'); window.scrollTo(0, 1);
    setTimeout(fitCanvas, 60); return;
  }
  Sfx.unlock();
  try {
    if (FSROOT.requestFullscreen) {
      const r = FSROOT.requestFullscreen({ navigationUI: 'hide' });
      if (r && r.then) r.then(() => { document.body.classList.remove('pfs'); setTimeout(fitCanvas, 60); })
                       .catch(() => { document.body.classList.add('pfs'); window.scrollTo(0, 1); setTimeout(fitCanvas, 60); });
    } else if (FSROOT.webkitRequestFullscreen) { FSROOT.webkitRequestFullscreen(); document.body.classList.remove('pfs'); }
    else { document.body.classList.add('pfs'); window.scrollTo(0, 1); }
  } catch (e) { document.body.classList.add('pfs'); }
  setTimeout(fitCanvas, 60); setTimeout(fitCanvas, 350);
}
/* ЛЮБОЙ тап/клик в любом месте и состоянии = разворот на весь экран.
   Если был псевдо-режим — тап обновляет его до настоящего полного экрана. */
document.addEventListener('pointerdown', () => { if (!isFS()) enterFS(); }, { capture: true, passive: true });
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => {
  if (isFS()) document.body.classList.remove('pfs');                // настоящий ФС — псевдо больше не нужен
  else fsExitT = Date.now();          // игрок сам погасил ФС: пара секунд не лезем обратно
  setTimeout(fitCanvas, 100);
  if (!isFS()) setTimeout(() => { if (!isFS()) enterFS(); }, 120);  // сами возвращаемся в полный экран
}));
/* автоматический полный экран: игра разворачивается сама при старте уровня */
function autoFS() { if (!isFS()) enterFS(); }
/* при самом открытии страницы — сразу растянуться на всё окно */
enterFS();

/* будим экран (Wake Lock), пока играем на телефоне */
let wakeLock = null;
async function keepAwake() {
  if (!IS_TOUCH || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
  try { if (!wakeLock) { wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {}
}
document.addEventListener('visibilitychange', () => { Bank.flush(); if (document.visibilityState === 'visible') keepAwake(); });
if (IS_TOUCH) addEventListener('pointerdown', keepAwake, { passive: true });

/* портрет на телефоне: оверлей «поверните устройство» + авто-пауза */
if (IS_TOUCH) {
  const rot = document.getElementById('rotate');
  const mqP = matchMedia('(orientation: portrait)');
  const onOrient = () => {
    const portrait = mqP.matches;
    if (rot) rot.classList.toggle('show', portrait);
    Keys.pause = false;              // сбрасываем, чтобы пауза не «залипла»
    if (portrait && G.state === 'play') Keys.pause = true; // update() сам поставит паузу
    if (portrait && G.state === 'arena' && !ARN.over) ARN.paused = true; // в арене — своя пауза
  };
  if (mqP.addEventListener) mqP.addEventListener('change', onOrient);
  else if (mqP.addListener) mqP.addListener(onOrient);
  addEventListener('orientationchange', () => setTimeout(onOrient, 120));
  onOrient();
}

/* отладочный хук для QA-автоматизации (не влияет на игру) */
window.__G = { G, P, getL: () => L, parseLevel, startCard, beginPlay,
               keys: Keys, Save, Prog, Bank, SKINS, ACC, ACC_BY_ID, SPR, tabRect, cardRect, bossContact,
               menuBtnRect, menuItems, winBtnRect, CHAN_LINKS, claimWinBonus, navAd, winBonus: WIN_BONUS,
               adViews: () => adViews, adLimit: AD_LIMIT, adReset: () => { adViews = 0; },
               ARTS, ART_BY_ID, artCardRect, hurt: () => hurtPlayer(),
               accCardRect, shopCardRect, shopTabRect, SHOP_TABS, SHOP_BACK,
               fsOn: () => fsOn(), enterFS, toggleFS: enterFS,
               killBoss: () => { const b = L && L.boss; if (b && !b.dead) { b.hp = 1; b.flash = 0; P.vy = 100; bossContact(b, true); } },
               die: () => killPlayer(),
               perf: () => ({ fps: fpsVal }),
               warp:(n)=>{ G.level=n; parseLevel(n); resetPlayer(true); resetLevelStats(); G.state='play'; Sfx.music(n); },
               skipSplash: () => window.__SPLASH && window.__SPLASH.skip(),
               splashDone: () => !document.getElementById('splash'),
               aboutBtnRect, aboutOpen: () => { G.state = 'about'; }, aboutNav, aboutSupport: ABOUT_SUPPORT_URL,
               aboutPanelRect, aboutChRect, aboutPlanRect, supBtnRect, aboutCloseRect, SEL_BACK,
               ARN, arenaStart, arenaExit, arenaBest, arenaHurt, arenaWave,
               arenaBtnRetryRect, arenaBtnResumeRect, arenaBtnMenuRect, arenaBoxRect,
               NET, netHost, netJoin, netClose, netCfg, netKeyOk, netDbGame, arnPanelRect, arnBtnRect, arnCancelRect,
               arnBackRect, arenaXRect, netJoinShow, netJoinHide, HAVE_SUPA,
               ARENA_PLATS, ARENA_PORTALS: ARN_PORTALS, note };

/* DEV: index.html?level=N — сразу играть на уровне N (нумерация с 1).
   Используется кнопкой «Играть» в редакторе карт (map/editor.html). */
(function devLevelParam() {
  let q = null;
  try { q = new URLSearchParams(location.search).get('level'); } catch (e) {}
  if (q === null || q === '') return;
  const n = parseInt(q, 10);
  if (!isNaN(n)) __G.warp(clamp(n, 1, MAPS.length) - 1);
})();

/* DEV: index.html?arena=1 — сразу в режим «АРЕНА» (для проверки и тестов). */
(function devArenaParam() {
  let q = null;
  try { q = new URLSearchParams(location.search).get('arena'); } catch (e) {}
  if (q === '1') arenaStart();
})();

/* ВОЗВРАТ С КАНАЛА: если игрок только что смотрел рекламу — красиво показываем,
   сколько монет она дала, и продолжаем чередование каналов с того же места. */
(function adReturnHello() {
  try {
    const r = JSON.parse(localStorage.getItem(AD_RET_KEY) || 'null');
    if (r) {
      if (typeof r.n === 'number' && r.n >= 0) adRotate = r.n;      // чередование TG/MAX продолжается
      if (r.c && Date.now() - r.t < 300000)                          // метка свежая (до 5 минут)
        note(`+${r.c} МОНЕТ ЗА ПРОСМОТР РЕКЛАМЫ — СПАСИБО!`, 4);
    }
    localStorage.removeItem(AD_RET_KEY);
  } catch (e) {}
})();
