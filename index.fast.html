     Возврат с рекламного канала и параметр ?nosplash заставку не показывают. */
  #splash { position:fixed; inset:0; z-index:9999; overflow:hidden; cursor:pointer;
    background:radial-gradient(circle at 50% 45%, #14141a 0%, #0d0d10 40%, #000 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #splash.gone { animation:spFade .45s ease forwards; }
  @keyframes spFade { to { opacity:0; visibility:hidden; } }
  /* виньетка по краям */
  #splash::after { content:""; position:absolute; inset:0;

  /* двойные дуги на фоне */
  .sp-arc { position:absolute; left:50%; top:45%; transform:translate(-50%,-50%);

    animation:spFloat linear infinite; }
  @keyframes spFloat { 0% { transform:translateY(0) scale(1); opacity:0; }

  /* центральный блок: монограмма + имя + линия + подпись */
  .sp-wrap { position:relative; text-align:center; z-index:2; opacity:0;
    animation:spIn .9s ease .15s forwards; }
  @keyframes spIn { from { opacity:0; transform:translateY(10px) scale(.97); }

  .sp-mono { width:20vmin; height:auto; image-rendering:pixelated; margin:0 auto 1.4vmin;

  .sp-logo { font:bold clamp(34px, 8.5vmin, 92px) "Courier New", monospace;

  /* ввод кода комнаты (мультиплеер арены): центр экрана поверх канваса */

<!-- ---------- ЗАСТАВКА КОМПАНИИ: TWIIN GAMES ----------
     Показывается при каждом холодном запуске игры. Тап/клик/Enter/Пробел —
     пропустить. При возврате с рекламного канала (метка bob5_ad_return) и в
     тестовом режиме (?nosplash) заставка не показывается, чтобы не мешать.
     Полный экран включается как обычно — любым тапом (обработчик игры). -->
<div id="splash" aria-label="Заставка Twiin Games">
  <div class="sp-arc" aria-hidden="true" style="width:70vmin;height:70vmin"></div>
  <div class="sp-arc a2" aria-hidden="true" style="width:48vmin;height:48vmin"></div>
  <div class="sp-wrap">
    <canvas id="spMono" class="sp-mono" width="9" height="8" aria-hidden="true"></canvas>
    <div class="sp-logo">Twiin <span>Games</span></div>
    <div class="sp-line" aria-hidden="true"></div>
    <div class="sp-sub">created by Twiin Games</div>
  </div>
  <div class="sp-hint" aria-hidden="true">нажми — продолжить</div>
</div>
<script>
/* быстрый скрипт заставки — работает сразу, не дожидаясь основного кода игры */
(function () {
  const sp = document.getElementById('splash');
  window.__SPLASH = { done: false, skip: () => finish(false) };
  let gone = false, timer = 0, rm = 0;

  /* когда заставка не нужна: тестовый параметр ?nosplash или возврат с
     рекламного канала (метку всё равно съест основной код при загрузке) */
  let notNeeded = false;
  try { notNeeded = /(?:^|[?&])nosplash/.test(location.search) ||
        !!localStorage.getItem('bob5_ad_return'); } catch (e) {}
  if (notNeeded) { finish(true); return; }

  /* пиксельная монограмма «T» в золоте игры + искра в углу */
  (function mono() {
    const T = ['LLLLLLLLL', 'YYYYYYYYY', '...YYY...', '...YYY...',
               '...YYY...', '...YYY...', '...YYY...', '...YYY...'];
    const C = { L:'#fff3b0', Y:'#ffd800', B:'#7fd8ff' };
    const g = document.getElementById('spMono').getContext('2d');
    for (let y = 0; y < T.length; y++) for (let x = 0; x < T[y].length; x++) {
      const ch = T[y][x]; if (C[ch]) { g.fillStyle = C[ch]; g.fillRect(x, y, 1, 1); }
    }
    g.fillStyle = C.B; g.fillRect(8, 0, 1, 1);
  })();

  /* всплывающие частицы */
  for (let i = 0; i < 26; i++) {
    const p = document.createElement('div');
    p.className = 'sp-part';
    const s = Math.random() * 3 + 1;
    p.style.cssText = 'width:' + s + 'px;height:' + s + 'px;left:' +
      (Math.random() * 100) + '%;top:' + (78 + Math.random() * 22) +
      '%;animation-duration:' + (6 + Math.random() * 8) +
      's;animation-delay:' + (Math.random() * 5) + 's';
    sp.appendChild(p);
  }

  function finish(instant) {
    if (gone) return;
    gone = true;
    clearTimeout(timer); clearTimeout(rm);
    removeEventListener('pointerdown', onTap, true);
    removeEventListener('keydown', onKey, true);
    if (instant) { sp.remove(); window.__SPLASH.done = true; return; }
    sp.classList.add('gone');                       // плавное затухание .45 c
    rm = setTimeout(() => { sp.remove(); window.__SPLASH.done = true; }, 480);
  }
  function onTap() { finish(false); }
  function onKey(e) {
    if (e.code === 'Enter' || e.code === 'Space' || e.code === 'NumpadEnter' ||
        e.code === 'Escape') finish(false);
  }
  addEventListener('pointerdown', onTap, true);
  addEventListener('keydown', onKey, true);
  timer = setTimeout(() => finish(false), 3300);    // сама уходит через ~3.3 c
})();
</script>

<script>
/* ================= C++/WASM-ДВИЖКИ SUPER BOB =================
   bobphys — коллизии/физика, bobfx — частицы (SoA, ноль аллокаций).
   Ниже встроен JS-двойник движка (fallback), затем клей ENG.
   Эквивалентность проверяется tests/test_equiv.js. */
/* ============================================================
   SUPER BOB — JS-двойник C++ движков (bobphys + bobfx).
   Побайтово та же семантика, что в engine/bob_engine.cpp:
   тот же layout памяти, те же формулы, то же округление.
   Используется как fallback, если WebAssembly недоступен,
   и как эталон в тестах эквивалентности (tests/).
   ============================================================ */
'use strict';
(function (g) {
  const MAX_GRID = 512 * 256, MAX_BOXES = 256, MAX_PARTS = 240;

  g.BobTwin = function () {
    const GRID = new Uint8Array(MAX_GRID);
    let GW = 0, GH = 0;
    const ENT = new Float64Array(6);            // x y w h vx vy
    const OUT = new Int32Array(8);              // [0]hitWall [1]grounded [2]bumpTx [3]bumpTy [4]fxCount [5]boxCount
    const BOX = new Float64Array(MAX_BOXES * 4);
    let BOXN = 0;
    const PX = new Float64Array(MAX_PARTS), PY = new Float64Array(MAX_PARTS),
          PVX = new Float64Array(MAX_PARTS), PVY = new Float64Array(MAX_PARTS),
          PT = new Float64Array(MAX_PARTS), PLIFE = new Float64Array(MAX_PARTS),
          PSZ = new Float64Array(MAX_PARTS);
    const PCOL = new Uint8Array(MAX_PARTS), PFL = new Uint8Array(MAX_PARTS);
    let PN = 0;

    function tileAt(px, py) {
      const x = Math.floor(px / 16), y = Math.floor(py / 16);
      if (x < 0 || x >= GW) return 1;
      if (y < 0 || y >= GH) return 0;
      return GRID[y * GW + x];
    }
    function solidAt(px, py) {
      if (tileAt(px, py) === 1) return true;
      for (let i = 0; i < BOXN; i++) {
        const o = i * 4;
        if (px >= BOX[o] && px < BOX[o] + BOX[o + 2] && py >= BOX[o + 1] && py < BOX[o + 1] + BOX[o + 3]) return true;
      }
      return false;
    }
    return {
      kind: 'js',
      ready: Promise.resolve(),
      init() { GW = GH = 0; BOXN = 0; PN = 0; OUT.fill(0); },
      setLevel(w, h, gridU8) { GRID.set(gridU8.subarray(0, Math.min(gridU8.length, MAX_GRID))); GW = w; GH = h; },
      setTile(tx, ty, v) { if (tx >= 0 && tx < GW && ty >= 0 && ty < GH) GRID[ty * GW + tx] = v; },
      solid(px, py) { return solidAt(px, py); },
      syncBoxes(list) {
        const n = Math.min(list.length, MAX_BOXES);
        for (let i = 0; i < n; i++) { const b = list[i], o = i * 4; BOX[o] = b.x; BOX[o + 1] = b.y; BOX[o + 2] = b.w; BOX[o + 3] = b.h; }
        BOXN = n; OUT[5] = n;
      },
      moveX(e, dt) {
        ENT[0] = e.x; ENT[1] = e.y; ENT[2] = e.w; ENT[3] = e.h; ENT[4] = e.vx; ENT[5] = e.vy;
        const x = ENT[0] + ENT[4] * dt, y = ENT[1], w = ENT[2], h = ENT[3], vx = ENT[4];
        const y0 = Math.floor((y + 1) / 16), y1 = Math.floor((y + h - 1) / 16);
        if (vx > 0) {
          const tx = Math.floor((x + w) / 16);
          for (let ty = y0; ty <= y1; ty++)
            if (solidAt(tx * 16 + 8, ty * 16 + 8)) { ENT[0] = tx * 16 - w - 0.01; OUT[0] = 1; e.x = ENT[0]; e.hitWall = 1; return; }
        } else if (vx < 0) {
          const tx = Math.floor(x / 16);
          for (let ty = y0; ty <= y1; ty++)
            if (solidAt(tx * 16 + 8, ty * 16 + 8)) { ENT[0] = (tx + 1) * 16 + 0.01; OUT[0] = -1; e.x = ENT[0]; e.hitWall = -1; return; }
        }
        ENT[0] = x; OUT[0] = 0; e.x = ENT[0]; e.hitWall = 0;
      },
      moveY(e, dt) {
        ENT[0] = e.x; ENT[1] = e.y; ENT[2] = e.w; ENT[3] = e.h; ENT[4] = e.vx; ENT[5] = e.vy;
        const y = ENT[1] + ENT[5] * dt, x = ENT[0], w = ENT[2], h = ENT[3], vy = ENT[5];
        OUT[1] = 0; OUT[2] = -1; OUT[3] = -1;
        const x0 = Math.floor((x + 1) / 16), x1 = Math.floor((x + w - 1) / 16);
        if (vy >= 0) {
          const ty = Math.floor((y + h) / 16);
          for (let tx = x0; tx <= x1; tx++)
            if (solidAt(tx * 16 + 8, ty * 16 + 8)) { ENT[1] = ty * 16 - h; ENT[5] = 0; OUT[1] = 1; break; }
        } else {
          const ty = Math.floor(y / 16);
          let bumped = -1, best = 1e9;
          for (let tx = x0; tx <= x1; tx++)
            if (solidAt(tx * 16 + 8, ty * 16 + 8)) {
              const d = Math.abs((tx * 16 + 8) - (x + w / 2));
              if (d < best) { best = d; bumped = tx; }
            }
          if (bumped >= 0) { ENT[1] = (ty + 1) * 16 + 0.01; ENT[5] = 0; OUT[2] = bumped; OUT[3] = ty; }
        }
        if (OUT[2] < 0 && OUT[1] === 0) { ENT[1] = y; ENT[5] = vy; }
        e.y = ENT[1]; e.vy = ENT[5];
        e.grounded = OUT[1];
      },
      out: OUT,
      fxClear() { PN = 0; },
      fxSpawn(x, y, vx, vy, life, s, col, flags) {
        let i;
        if (PN < MAX_PARTS) i = PN++;
        else i = 0;
        PX[i] = x; PY[i] = y; PVX[i] = vx; PVY[i] = vy;
        PT[i] = 0; PLIFE[i] = life; PSZ[i] = s;
        PCOL[i] = col; PFL[i] = flags;
      },
      fxStep(dt) {
        let i = 0;
        while (i < PN) {
          PT[i] += dt;
          if (PFL[i] & 2) { PVY[i] += 700 * dt; PY[i] += PVY[i] * dt; }
          else { PVY[i] += ((PFL[i] & 1) ? 900 : 200) * dt; PX[i] += PVX[i] * dt; PY[i] += PVY[i] * dt; }
          if (PT[i] > PLIFE[i]) {
            const last = --PN;
            if (i !== last) {
              PX[i] = PX[last]; PY[i] = PY[last]; PVX[i] = PVX[last]; PVY[i] = PVY[last];
              PT[i] = PT[last]; PLIFE[i] = PLIFE[last]; PSZ[i] = PSZ[last];
              PCOL[i] = PCOL[last]; PFL[i] = PFL[last];
            }
          } else i++;
        }
        OUT[4] = PN;
        return PN;
      },
      fxCount() { return PN; },
      fxX() { return PX; }, fxY() { return PY; }, fxT() { return PT; },
      fxLife() { return PLIFE; }, fxS() { return PSZ; },
      fxCol() { return PCOL; }, fxFlags() { return PFL; }
    };
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* ============================================================
   SUPER BOB — клей между игрой и движками (C++/WASM или JS).
   Игра общается только с window.ENG; реализации взаимозаменяемы
   и побайтово эквивалентны (проверяется tests/test_equiv.js).
   Порядок подключения: bob_twin.js (fallback) -> bob_engine.js
   (WASM, опционально) -> этот файл. Готовность: ENG.ready.
   ============================================================ */
'use strict';
(function (g) {
  const js = g.BobTwin();
  let impl = js;
  const ENG = {
    mode: 'js',
    ready: null,
    out: js.out,          // Int32Array: [0]hitWall [1]grounded [2]bumpTx [3]bumpTy [4]fxCount
    /* --- физика --- */
    init: () => impl.init(),
    setLevel: (w, h, grid) => impl.setLevel(w, h, grid),
    setTile: (tx, ty, v) => impl.setTile(tx, ty, v),
    solid: (px, py) => impl.solid(px, py),
    syncBoxes: (list) => impl.syncBoxes(list),
    moveX: (e, dt) => impl.moveX(e, dt),
    moveY: (e, dt) => impl.moveY(e, dt),
    /* --- частицы (bobfx) --- */
    fxClear: () => impl.fxClear(),
    fxSpawn: (x, y, vx, vy, life, s, col, flags) => impl.fxSpawn(x, y, vx, vy, life, s, col, flags),
    fxStep: (dt) => impl.fxStep(dt),
    fxCount: () => impl.fxCount(),
    fxX: () => impl.fxX(), fxY: () => impl.fxY(), fxT: () => impl.fxT(),
    fxLife: () => impl.fxLife(), fxS: () => impl.fxS(),
    fxCol: () => impl.fxCol(), fxFlags: () => impl.fxFlags()
  };

  let resolveReady;
  ENG.ready = new Promise(r => { resolveReady = r; });

  function adoptWasm(M) {
    const exports = M._eng_init ? M : M.moduleExports || M;
    const heapF64 = () => M.HEAPF64, heapU8 = () => M.HEAPU8;
    const gridPtr = exports._grid_base(), entPtr = exports._ent_base(),
          outPtr = exports._out_base(), boxPtr = exports._box_base();
    const fxP = {
      x: exports._fx_x_base(), y: exports._fx_y_base(), t: exports._fx_t_base(),
      life: exports._fx_life_base(), s: exports._fx_s_base()
    };
    const colP = exports._fx_col_base(), flgP = exports._fx_flags_base();
    const F64 = heapF64(), U8 = heapU8();
    const OUTW = new Int32Array(F64.buffer, outPtr, 8);
    const V = {
      x: F64.subarray(fxP.x >> 3, (fxP.x >> 3) + 240),
      y: F64.subarray(fxP.y >> 3, (fxP.y >> 3) + 240),
      t: F64.subarray(fxP.t >> 3, (fxP.t >> 3) + 240),
      life: F64.subarray(fxP.life >> 3, (fxP.life >> 3) + 240),
      s: F64.subarray(fxP.s >> 3, (fxP.s >> 3) + 240),
      col: U8.subarray(colP, colP + 240),
      flags: U8.subarray(flgP, flgP + 240)
    };
    const w = {
      kind: 'wasm',
      init: () => exports._eng_init(),
      setLevel(w_, h_, grid) {
        U8.set(grid.subarray(0, Math.min(grid.length, 512 * 256)), gridPtr);
        exports._eng_set_level(w_, h_);
      },
      setTile: (tx, ty, v) => exports._eng_set_tile(tx, ty, v),
      solid: (px, py) => exports._eng_solid(px, py) === 1,
      syncBoxes(list) {
        const n = Math.min(list.length, 256), base = boxPtr >> 3;
        const F = heapF64();
        for (let i = 0; i < n; i++) {
          const b = list[i], o = base + i * 4;
          F[o] = b.x; F[o + 1] = b.y; F[o + 2] = b.w; F[o + 3] = b.h;
        }
        exports._eng_sync_boxes(n);
      },
      moveX(e, dt) {
        const E = heapF64(), base = entPtr >> 3;
        E[base] = e.x; E[base + 1] = e.y; E[base + 2] = e.w; E[base + 3] = e.h; E[base + 4] = e.vx; E[base + 5] = e.vy;
        exports._eng_move_x(dt);
        e.x = E[base]; e.hitWall = OUTW[0];
      },
      moveY(e, dt) {
        const E = heapF64(), base = entPtr >> 3;
        E[base] = e.x; E[base + 1] = e.y; E[base + 2] = e.w; E[base + 3] = e.h; E[base + 4] = e.vx; E[base + 5] = e.vy;
        exports._eng_move_y(dt);
        e.y = E[base + 1]; e.vy = E[base + 5]; e.grounded = OUTW[1];
      },
      out: OUTW,
      fxClear: () => exports._fx_clear(),
      fxSpawn: (x, y, vx, vy, life, s, col, flags) => exports._fx_spawn(x, y, vx, vy, life, s, col, flags),
      fxStep: (dt) => exports._fx_step(dt),
      fxCount: () => exports._fx_count(),
      fxX: () => V.x, fxY: () => V.y, fxT: () => V.t,
      fxLife: () => V.life, fxS: () => V.s,
      fxCol: () => V.col, fxFlags: () => V.flags
    };
    return w;
  }

  function tryWasm() {
    return new Promise(res => {
      if (typeof g.BobEngWasm !== 'function') return res(false);
      let M;
      try { M = g.BobEngWasm(); } catch (e) { return res(false); }
      M.then(m => {
        try {
          const w = adoptWasm(m);
          w.init();
          impl = w; ENG.mode = 'wasm'; ENG.out = w.out;
          res(true);
        } catch (e) { res(false); }
      }, () => res(false));
    });
  }

  ENG.ready = tryWasm().then(ok => { if (!ok) impl.init(); resolveReady(ok ? 'wasm' : 'js'); return ENG.mode; });
  g.ENG = ENG;
})(typeof window !== 'undefined' ? window : globalThis);

/* ============================================================
   SUPER BOB: В поисках Пяти Печатей Дракона —

/* ---------- КОНФИГУРАЦИЯ (все игровые числа — только здесь) ---------- */
const CFG = {
  TILE: 16, VW: 512, VH: 288,               // тайл и внутреннее разрешение

/* ---------- МЕЛКИЕ УТИЛИТЫ ---------- */
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;
const aabb  = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
// детерминированный «шум» для декора (без Math.random в рендере)
function hash(n) { n = (n << 13) - n; return ((n * (n * n * 15731 + 789221) + 1376312589) & 0x7fffffff) / 0x7fffffff; }

/* ---------- ВВОД: клавиатура + сенсор ---------- */
const Keys = { left:false, right:false, jump:false, jumpBuf:0, confirm:false, confirmEdge:false, pause:false, pauseEdge:false, shopTabEdge:false };
const KEYMAP = {
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  ArrowUp:'jump', KeyW:'jump', Space:'jump',
  ArrowDown:'down', KeyS:'down',
  Enter:'confirm', KeyE:'confirm', Escape:'pause', KeyP:'pause', KeyM:'mute', KeyQ:'shopTab'
};
addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;   // ввод кода комнаты — не игре
  const a = KEYMAP[e.code]; if (!a) return;
  e.preventDefault();
  if (a === 'mute') { Sfx.muted = !Sfx.muted; return; }
  if (a === 'shopTab') { Keys.shopTabEdge = true; return; }   // Q — вкладка магазина
  if (a === 'jump' && !Keys.jump) Keys.jumpBuf = 0.12;   // буфер прыжка
  if (a === 'confirm' && !Keys.confirm) Keys.confirmEdge = true;
  if (a === 'pause' && !Keys.pause) Keys.pauseEdge = true;  // защёлка: Esc/P между кадрами не потеряется
  Keys[a] = true;
  Sfx.unlock(); // первый жест — разрешаем звук
});
addEventListener('keyup', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  const a = KEYMAP[e.code]; if (!a) return; e.preventDefault(); Keys[a] = false;
});
function bindTouch(id, act) {
  const el = document.getElementById(id); if (!el) return;
  const on = e => { e.preventDefault(); Sfx.unlock();
    if (act === 'jump' && !Keys.jump) Keys.jumpBuf = 0.12;
    if (act === 'jump') Keys.confirmEdge = true;   // «A» = «дальше» в меню
    if (act === 'confirm') Keys.confirmEdge = true;
    if (act === 'pause') Keys.pause = !Keys.pause;
    Keys[act] = true; el.classList.add('on'); };
  const off = e => { e.preventDefault(); if (act !== 'pause') Keys[act] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off);
  el.addEventListener('pointerleave', off); el.addEventListener('pointercancel', off);
}
bindTouch('tL','left'); bindTouch('tR','right'); bindTouch('tJ','jump'); bindTouch('tP','pause');

/* ---------- ЗВУК: процедурный чиптюн на WebAudio ---------- */
const Sfx = {
  ctx: null, muted: false, musicTimer: null, step: 0, song: null,
  unlock() { // создаём контекст по первому жесту (политика браузеров)
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  },
  tone(f0, f1, dur, type = 'square', vol = 0.22, when = 0) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(Math.max(30, f0), t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur = 0.15, vol = 0.18) { // шорох/разбитие
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime, n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = this.ctx.createBufferSource(), g = this.ctx.createGain();
    s.buffer = buf; g.gain.value = vol; s.connect(g); g.connect(this.ctx.destination); s.start(t);
  },
  jump()     { this.tone(260, 620, 0.16, 'square', 0.18); },
  stomp()    { this.tone(300, 90, 0.14, 'square', 0.22); this.noise(0.08, 0.1); },
  coin()     { this.tone(988, 988, 0.07, 'square', 0.16); this.tone(1319, 1319, 0.24, 'square', 0.16, 0.07); },
  brick()    { this.noise(0.2, 0.22); this.tone(220, 60, 0.15, 'triangle', 0.2); },
  bump()     { this.tone(160, 90, 0.1, 'square', 0.18); },
  power()    { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, f, 0.12, 'square', 0.2, i * 0.09)); },
  hurt()     { this.tone(400, 90, 0.3, 'sawtooth', 0.2); },
  die()      { [523, 494, 392, 262, 196].forEach((f, i) => this.tone(f, f, 0.16, 'square', 0.2, i * 0.12)); },
  seal()     { [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, f, 0.18, 'triangle', 0.22, i * 0.1)); },
  roar()     { this.tone(120, 38, 0.7, 'sawtooth', 0.3); this.noise(0.5, 0.16);
               this.tone(60, 30, 0.9, 'triangle', 0.26, 0.1); },
  bossHit()  { this.tone(180, 60, 0.25, 'sawtooth', 0.25); this.noise(0.15, 0.15); },
  fire()     { this.tone(700, 200, 0.2, 'sawtooth', 0.12); },
  plate()    { this.tone(520, 340, 0.09, 'square', 0.16); },              // кнопка нажата
  gate(open) { if (open) { this.tone(120, 340, 0.35, 'square', 0.16); this.noise(0.3, 0.1); }
               else   { this.tone(320, 110, 0.3, 'square', 0.14); this.noise(0.24, 0.09); } },
  key()      { [880, 1175, 1568].forEach((f, i) => this.tone(f, f, 0.12, 'triangle', 0.2, i * 0.08)); },
  unlockSnd(){ [659, 880, 784, 1319].forEach((f, i) => this.tone(f, f, 0.14, 'square', 0.2, i * 0.1)); this.noise(0.2, 0.12); }, // замок открыт
  star()     { [784, 988, 1175, 1568, 1319, 1568].forEach((f, i) => this.tone(f, f, 0.13, 'triangle', 0.2, i * 0.08)); }, // звезда неуязвимости
  plank()    { this.noise(0.14, 0.14); this.tone(180, 70, 0.2, 'triangle', 0.18); }, // мостик рассыпался
  creak()    { this.tone(95, 70, 0.08, 'triangle', 0.07); },              // скрип камня
  fanfare()  { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => this.tone(f, f, 0.16, 'square', 0.2, i * 0.13)); },
  gameover() { [392, 370, 349, 330, 262].forEach((f, i) => this.tone(f, f, 0.3, 'triangle', 0.22, i * 0.3)); },
  /* фоновая музыка: простой 16-шаговый секвенсор, своя тональность на землю */
  music(levelIdx) {
    this.stopMusic();
    if (!this.ctx || this.muted) return;
    const bass = [0, 0, 7, 0, 5, 5, 7, 7, 0, 0, 7, 0, 10, 10, 7, 5];
    const mel  = [12, null, 16, 19, null, 17, 16, 14, 12, null, 19, 17, 16, null, 14, 12];
    const root = [131, 110, 147, 98, 87][levelIdx % 5]; // C2 A2 D2 G2 F2
    const tick = [150, 150, 170, 135, 120][levelIdx % 5];
    this.step = 0; this.song = { bass, mel, root };
    this.musicTimer = setInterval(() => {
      if (this.muted || !this.ctx) return;
      const s = this.step % 16;
      const b = this.song.bass[s], m = this.song.mel[s];
      this.tone(root * Math.pow(2, b / 12), root * Math.pow(2, b / 12), tick / 1000 * 0.9, 'triangle', 0.075);
      if (m !== null) this.tone(root * 2 * Math.pow(2, m / 12), root * 2 * Math.pow(2, m / 12), tick / 1000 * 0.8, 'square', 0.045);
      if (s % 4 === 0) this.noise(0.03, 0.03);
      this.step++;
    }, tick);
  },
  stopMusic() { if (this.musicTimer) { clearInterval(this.musicTimer); this.musicTimer = null; } }
};

/* ---------- СОХРАНЕНИЯ: автопрогресс между сессиями ----------
   bob5_save  — прогресс кампании (уровень, печати, очки, монеты, жизни),
   bob5_cp    — контрольная точка «у босса» внутри текущего уровня.
   Пишутся автоматически: вход в уровень, чекпоинт, победа над боссом. */
const Save = {
  KEY: 'bob5_save', CPKEY: 'bob5_cp',
  data() { try { const s = localStorage.getItem(this.KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } },
  write() { // снимок текущего прогресса
    try { localStorage.setItem(this.KEY, JSON.stringify({
      lv: G.level, seals: G.seals.slice(), score: G.score, coins: G.coins, lives: G.lives })); } catch (e) {}
  },
  read() { const d = this.data(); if (!d) return false;
    G.level = d.lv | 0; G.seals = (d.seals || [false,false,false,false,false]).slice();
    G.score = d.score | 0; G.coins = d.coins | 0; G.lives = Math.max(1, d.lives | 0);
    return true; },
  writeNext() { // снимок «уровень пройден» — «ПРОДОЛЖИТЬ» ведёт сразу на следующий уровень
    const lv = Math.min(G.level + 1, MAPS.length - 1);
    try { localStorage.setItem(this.KEY, JSON.stringify({
      lv, seals: G.seals.slice(), score: G.score, coins: G.coins, lives: G.lives })); } catch (e) {}
  },
  clear() { try { localStorage.removeItem(this.KEY); localStorage.removeItem(this.CPKEY); } catch (e) {} }
};

/* ---------- ПРОГРЕСС ПО УРОВНЯМ: звёзды и лучшее время ----------
   bob5_prog — { [индекс уровня]: { s: звёзды 0..3, t: лучшее время, сек } }.
   ★ — за прохождение, ★★ — без единой смерти, ★★★ — уложился в целевое
   время уровня (показывается на карточке уровня). Уровень открывается,
   когда пройден предыдущий; звёзды сохраняются навсегда. */
const Prog = {
  KEY: 'bob5_prog_v1', d: {},
  load() { try { const r = JSON.parse(localStorage.getItem(this.KEY));
                   this.d = (r && typeof r === 'object') ? r : {}; } catch (e) { this.d = {}; }
           for (const k in this.d) { const v = this.d[k];
             if (!v || typeof v.s !== 'number') delete this.d[k];
             else { v.s = clamp(v.s|0, 0, 3); if (typeof v.t !== 'number' || v.t <= 0) delete v.t; } } },
  get(i) { return this.d[i] || null; },
  record(i, stars, time) { const old = this.get(i) || { s: 0 };
    const rec = { s: Math.max(old.s, stars) };
    if (old.t) rec.t = Math.min(old.t, time); else rec.t = time;
    this.d[i] = rec; this.write(); return rec; },
  cleared(i) { const r = this.get(i); return !!(r && r.s > 0); },
  maxUnlocked() { let i = 0; while (i < MAPS.length && this.cleared(i)) i++; return Math.min(i, MAPS.length - 1); },
  total() { let s = 0; for (const k in this.d) s += this.d[k].s || 0; return s; },
  write() { try { localStorage.setItem(this.KEY, JSON.stringify(this.d)); } catch (e) {} }
};
Prog.load();

/* ============================================================
   ГРАФИКА: пиксель-арт матрицы + процедурные тайлы и фоны.
   Каждый спрайт — массив строк; валидация длин на этапе сборки
   (build_game.py проверяет, что все строки одной ширины).
   Все образы оригинальные: Боб-путешественник, культисты
   «Детей Пепла», жрецы печатей и Пепельный Дракон.
   ============================================================ */
const PAL = { // общая палитра символов матриц
  R:'#e73b32', S:'#ffc7a0', H:'#5c3317', B:'#2a4bd7', Y:'#ffd800', W:'#ffffff',
  K:'#101010', N:'#8a4b20', G:'#3aba3a', D:'#1f7a1f', O:'#ff8c00', P:'#ff9ecb',
  T:'#f8c84a', V:'#8a4bd7', C:'#6ad8ff', A:'#9a9aa8', E:'#c89800', F:'#ff5a2a'
};
const SPR = {};
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function sheet(name, rows, map) { // map — перекраска отдельных символов (для боссов)
  const w = rows[0].length, h = rows.length, c = mkCanvas(w, h), g = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][x]; if (ch !== '.') { const col = (map && map[ch]) || PAL[ch]; if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); } }
  }
  SPR[name] = c;
  const f = mkCanvas(w, h), gf = f.getContext('2d');   // зеркальная копия

/* ---------- КОПИЛА МОНЕТ И МАГАЗИН ----------
   bob5_bank_v1 — { c: монеты на счету, own: купленные скины, cur: выбранный,
   aown: купленные аксессуары, aon: надетые аксессуары }.
   Монеты с уровней падают в копилку сразу при подборе и тратятся в магазине. */
const Bank = {
  KEY: 'bob5_bank_v1', d: { c: 0, own: ['classic'], cur: 'classic', aown: [], aon: [], art: [], rev: 0 },
  load() { try { const r = JSON.parse(localStorage.getItem(this.KEY));
      if (r && typeof r.c === 'number')
        this.d = { c: Math.max(0, r.c|0),
                   own: Array.isArray(r.own) && r.own.length ? r.own.filter(x => typeof x === 'string') : ['classic'],
                   cur: typeof r.cur === 'string' ? r.cur : 'classic',
                   aown: Array.isArray(r.aown) ? r.aown.filter(x => typeof x === 'string' && ACC_BY_ID[x]) : [],
                   aon:  Array.isArray(r.aon)  ? r.aon.filter(x => typeof x === 'string' && ACC_BY_ID[x]) : [],
                   art:  Array.isArray(r.art)  ? r.art.filter(x => typeof x === 'string' && ART_BY_ID[x]) : [],
                   rev:  Math.min(99, Math.max(0, r.rev|0)) };
    } catch (e) {}
    if (!this.d.own.includes('classic')) this.d.own.unshift('classic');
    if (!this.d.own.includes(this.d.cur)) this.d.cur = 'classic';
    this.d.aon = this.d.aon.filter(id => this.d.aown.includes(id)); },  // надеты только купленные
  dirty: false,
  write() { try { localStorage.setItem(this.KEY, JSON.stringify(this.d)); } catch (e) {} },
  coins() { return this.d.c; },
  earn(n) { this.d.c += n; this.dirty = true; },   // монеты падают часто — запись в localStorage отложена
  flush() { if (this.dirty) { this.dirty = false; this.write(); } },
  own(id) { return this.d.own.includes(id); },
  buy(id) { const s = SKINS.find(s => s.id === id);
    if (!s || this.own(id) || this.d.c < s.price) return false;
    this.d.c -= s.price; this.d.own.push(id); this.setSkin(id); return true; },
  /* аксессуары: покупка и надевание (один на слот; повторный тап снимает) */
  accOwn(id) { return this.d.aown.includes(id); },
  buyAcc(id) { const a = ACC_BY_ID[id];
    if (!a || this.accOwn(id) || this.d.c < a.price) return false;
    this.d.c -= a.price; this.d.aown.push(id); this.accEquip(id); return true; },   // купил — сразу надел
  accEquip(id) { const a = ACC_BY_ID[id]; if (!a || !this.accOwn(id)) return;
    const i = this.d.aon.indexOf(id);
    if (i >= 0) this.d.aon.splice(i, 1);                  // уже надет — снимаем
    else { for (let k = this.d.aon.length - 1; k >= 0; k--) {  // слот освобождаем
        const o = ACC_BY_ID[this.d.aon[k]]; if (o && o.slot === a.slot) this.d.aon.splice(k, 1); }
      this.d.aon.push(id); }
    this.write(); },
  accOn(slot) { for (const id of this.d.aon) { const a = ACC_BY_ID[id]; if (a && a.slot === slot) return id; } return null; },
  /* артефакты: постоянные (art) и расходник «перо феникса» (rev — заряды возрождения) */
  artOwn(id) { return this.d.art.includes(id); },
  buyArt(id) { const a = ART_BY_ID[id];
    if (!a || this.d.c < a.price) return false;
    if (a.cons) { this.d.c -= a.price; this.d.rev = Math.min(99, this.d.rev + 1); this.write(); return true; }
    if (this.artOwn(id)) return false;
    this.d.c -= a.price; this.d.art.push(id); this.write(); return true; },
  useRevive() { if (this.d.rev <= 0) return false; this.d.rev--; this.write(); return true; },
  magnet() { return this.artOwn('magnet'); },
  amulet() { return this.artOwn('amulet'); },
  setSkin(id) { if (!this.own(id)) return; this.d.cur = id; applySkin(id); this.write(); },
  skin() { return SKINS.find(s => s.id === this.d.cur) || SKINS[0]; },
  scarf() { return (CUR_SKIN.map && CUR_SKIN.map.R) || '#e73b32'; }
};

function dragonSheet(name, o, wingUp) { // ВЕЛЬЗАРУТ: 2 кадра взмаха крыльев

  px(g, 28, 4, 2, 2, o.glow);                                            // глаз

  px(g, 10, 20, 4, 6, o.shade); px(g, 18, 20, 4, 6, o.shade);           // лапы
  px(g, 10, 26, 4, 1, o.horn); px(g, 18, 26, 4, 1, o.horn);             // когти
  for (let i = 0; i < 4; i++) px(g, 10 + i * 4, 8, 2, 2, o.horn);       // гребень
  g.fillStyle = o.wing; g.beginPath();                                   // крыло

}

/* ---------- ТАЙЛЫ (рисуются под палитру земли) ---------- */
function buildTiles(p) {
  const T = {};
  const c16 = () => mkCanvas(16, 16);
  // земля: дёрн сверху + почва в крапинку
  T.groundTop = (() => { const c = c16(), g = c.getContext('2d');
    g.fillStyle = p.soil; g.fillRect(0, 0, 16, 16);
    g.fillStyle = p.grass; g.fillRect(0, 0, 16, 5);
    g.fillStyle = p.grassHi; for (let i = 0; i < 16; i += 2) g.fillRect(i, 0, 1, 2);
    g.fillStyle = p.soilDark; g.fillRect(0, 5, 16, 1);
    for (let i = 0; i < 6; i++) { const x = (hash(i * 31 + p.seed) * 14) | 0, y = 7 + ((hash(i * 77 + p.seed) * 8) | 0); g.fillRect(x, y, 2, 1); }
    return c; })();
  T.ground = (() => { const c = c16(), g = c.getContext('2d');
    g.fillStyle = p.soil; g.fillRect(0, 0, 16, 16);
    g.fillStyle = p.soilDark; for (let i = 0; i < 7; i++) g.fillRect((hash(i * 13 + p.seed) * 14) | 0, (hash(i * 29 + p.seed) * 14) | 0, 2, 2);
    return c; })();
  // камень (катакомбы/цитадель/ступени)
  T.stone = (() => { const c = c16(), g = c.getContext('2d');
    g.fillStyle = p.stone; g.fillRect(0, 0, 16, 16);
    g.fillStyle = p.stoneHi; g.fillRect(0, 0, 16, 2); g.fillRect(0, 0, 2, 16);
    g.fillStyle = p.stoneLo; g.fillRect(0, 14, 16, 2); g.fillRect(14, 0, 2, 16);
    g.fillRect(7, 2, 1, 12); g.fillRect(2, 7, 12, 1);
    return c; })();
  // кладка
  T.brick = (() => { const c = c16(), g = c.getContext('2d');
    g.fillStyle = p.brick; g.fillRect(0, 0, 16, 16);
    g.fillStyle = p.brickLo;
    for (let y = 0; y < 16; y += 4) { g.fillRect(0, y, 16, 1); for (let x = (y / 4) % 2 ? 4 : 0; x < 16; x += 8) g.fillRect(x, y, 1, 4); }
    g.fillStyle = p.brickHi; g.fillRect(0, 1, 16, 1);
    return c; })();
  // рунный блок и использованный блок
  const qbase = (used) => { const c = c16(), g = c.getContext('2d');
    g.fillStyle = used ? p.used : '#e8a000'; g.fillRect(0, 0, 16, 16);
    g.fillStyle = used ? p.usedHi : '#ffd85a'; g.fillRect(1, 1, 14, 2); g.fillRect(1, 1, 2, 14);
    g.fillStyle = used ? p.usedLo : '#a05a00'; g.fillRect(0, 14, 16, 2); g.fillRect(14, 0, 2, 16);
    g.fillStyle = used ? p.usedLo : '#5a3200';
    [[2,2],[12,2],[2,12],[12,12]].forEach(([x,y]) => g.fillRect(x, y, 2, 2));
    return c; };
  T.q = qbase(false);
  (() => { const g = T.q.getContext('2d'); g.fillStyle = '#5a3200'; // руна-глаз
    g.fillRect(6, 4, 4, 1); g.fillRect(5, 5, 1, 3); g.fillRect(10, 5, 1, 3);
    g.fillRect(6, 8, 4, 1); g.fillRect(7, 6, 2, 1); })();
  T.used = qbase(true);
  // ОБЕЛИСК: резная каменная стела культa (2 колонны-тайла + навершие)
  T.pipeL = (() => { const c = c16(), g = c.getContext('2d');
    g.fillStyle = p.pipe; g.fillRect(2, 0, 14, 16);
    g.fillStyle = p.pipeHi; g.fillRect(2, 0, 1, 16);
    g.fillStyle = p.pipeLo; g.fillRect(9, 0, 1, 16); g.fillRect(5, 4, 2, 2); g.fillRect(5, 10, 2, 2);
    return c; })();
  T.pipeR = (() => { const c = c16(), g = c.getContext('2d');
    g.fillStyle = p.pipe; g.fillRect(0, 0, 14, 16);
    g.fillStyle = p.pipeLo; g.fillRect(13, 0, 1, 16);
    g.fillStyle = p.pipeHi; g.fillRect(4, 4, 2, 2); g.fillRect(4, 10, 2, 2); g.fillRect(0, 0, 1, 16);
    return c; })();
  T.pipeTL = (() => { const c = c16(), g = c.getContext('2d');
    g.drawImage(T.pipeL, 0, 4); g.fillStyle = p.pipe; g.fillRect(0, 0, 16, 5);
    g.fillStyle = p.pipeHi; g.fillRect(0, 0, 16, 1); g.fillStyle = p.pipeLo; g.fillRect(0, 4, 16, 1);
    g.fillRect(15, 0, 1, 4); return c; })();
  T.pipeTR = (() => { const c = c16(), g = c.getContext('2d');
    g.drawImage(T.pipeR, 0, 4); g.fillStyle = p.pipe; g.fillRect(0, 0, 16, 5);
    g.fillStyle = p.pipeHi; g.fillRect(0, 0, 16, 1); g.fillRect(6, 1, 4, 2);  // светящаяся руна
    g.fillStyle = p.pipeLo; g.fillRect(0, 4, 16, 1); return c; })();
  // шипы
  T.spike = (() => { const c = c16(), g = c.getContext('2d');
    g.fillStyle = p.spikeBase || '#333'; g.fillRect(0, 12, 16, 4);
    g.fillStyle = '#c8ccd8';
    for (let i = 0; i < 4; i++) { const x = i * 4;
      g.fillRect(x + 1, 10, 2, 2); g.fillRect(x + 1, 8, 1, 2); }
    g.fillStyle = '#f0f4ff'; for (let i = 0; i < 4; i++) g.fillRect(i * 4 + 1, 8, 1, 1);
    return c; })();
  // магма (2 кадра анимации)
  T.lava = [0, 1].map(f => { const c = c16(), g = c.getContext('2d');
    g.fillStyle = '#d83000'; g.fillRect(0, 0, 16, 16);
    g.fillStyle = '#ff7a00'; g.fillRect(0, 0, 16, 4);
    g.fillStyle = '#ffd000';
    for (let x = 0; x < 16; x += 4) g.fillRect((x + f * 2) % 16, (x / 4) % 2 ? 1 : 2, 3, 1);
    g.fillStyle = '#ff7a00'; g.fillRect(0, 8, 16, 1); g.fillStyle = '#ffb400'; g.fillRect(3, 11, 5, 1);
    return c; });
  // ТОЛКАЕМЫЙ КАМЕНЬ: валун с рунным кругом — не спутать со ступенями
  T.pushBox = (() => { const c = c16(), g = c.getContext('2d');
    g.fillStyle = p.stone; g.fillRect(0, 0, 16, 16);
    g.fillStyle = p.stoneHi; g.fillRect(0, 0, 16, 2); g.fillRect(0, 0, 2, 16);
    g.fillStyle = p.stoneLo; g.fillRect(0, 14, 16, 2); g.fillRect(14, 0, 2, 16);
    g.beginPath(); g.arc(8, 8, 4.2, 0, 7); g.fill();
    g.fillStyle = p.stoneHi; g.beginPath(); g.arc(8, 8, 2.6, 0, 7); g.fill();
    g.fillStyle = p.accent; g.fillRect(7, 7, 2, 2);
    return c; })();
  // КНОПКА-ПЛИТА: ненажатая и утопленная
  const plateSpr = (on) => { const c = c16(), g = c.getContext('2d');
    g.fillStyle = '#2c2c38'; g.fillRect(0, 11, 16, 5);
    g.fillStyle = on ? '#ffd85a' : '#9aa2b8'; g.fillRect(2, on ? 13 : 10, 12, 3);
    g.fillStyle = '#54545f'; g.fillRect(0, 14, 16, 2);
    if (on) { g.fillStyle = 'rgba(255,216,90,.5)'; g.fillRect(3, 9, 10, 1); }
    return c; };
  T.plate0 = plateSpr(false); T.plate1 = plateSpr(true);
  // РЕШЁТКА (поднимается кнопкой)
  T.gate = (() => { const c = c16(), g = c.getContext('2d');
    g.fillStyle = '#23262f'; g.fillRect(0, 0, 16, 16);
    for (const x of [1, 5, 9, 13]) {
      g.fillStyle = '#6a7288'; g.fillRect(x, 0, 2, 16);
      g.fillStyle = '#9aa2b8'; g.fillRect(x, 0, 1, 16);
    }
    g.fillStyle = '#3c4254'; g.fillRect(0, 0, 16, 2); g.fillRect(0, 14, 16, 2);
    return c; })();
  // ЗАМОК-ВОРОТА (открывается ключом)
  T.lock = (() => { const c = c16(), g = c.getContext('2d');
    g.fillStyle = '#23262f'; g.fillRect(0, 0, 16, 16);
    for (const x of [1, 6, 11]) {
      g.fillStyle = '#6a7288'; g.fillRect(x, 0, 2, 16);
      g.fillStyle = '#9aa2b8'; g.fillRect(x, 0, 1, 16);
    }
    g.fillStyle = '#3c4254'; g.fillRect(0, 0, 16, 2); g.fillRect(0, 14, 16, 2);
    g.fillStyle = '#e8a000'; g.fillRect(4, 4, 8, 8);          // корпус замка
    g.fillStyle = '#ffd85a'; g.fillRect(5, 5, 6, 2);
    g.fillStyle = '#5a3200'; g.fillRect(7, 7, 2, 3);          // скважина
    return c; })();
  // КЛЮЧ
  T.key = (() => { const c = c16(), g = c.getContext('2d');
    g.fillStyle = '#e8a000'; g.beginPath(); g.arc(5, 6, 3.6, 0, 7); g.fill();
    g.fillStyle = '#2a1e08'; g.beginPath(); g.arc(5, 6, 1.5, 0, 7); g.fill();
    g.fillStyle = '#e8a000'; g.fillRect(7, 5, 8, 2);
    g.fillRect(10, 7, 1, 3); g.fillRect(13, 7, 1, 2);
    g.fillStyle = '#ffd85a'; g.fillRect(7, 5, 8, 1);
    return c; })();
  // ЛЕСТНИЦА: деревянные направляющие + перекладины (лезем, держа прыжок)
  T.ladder = (() => { const c = c16(), g = c.getContext('2d');
    g.fillStyle = '#6a4a28'; g.fillRect(1, 0, 3, 16); g.fillRect(12, 0, 3, 16);
    g.fillStyle = '#8a6234'; g.fillRect(1, 0, 1, 16); g.fillRect(12, 0, 1, 16);
    g.fillStyle = '#3d2a14'; g.fillRect(3, 0, 1, 16); g.fillRect(14, 0, 1, 16);
    g.fillStyle = '#a87f48';
    for (let y = 2; y < 16; y += 5) { g.fillRect(3, y, 10, 2); g.fillStyle = '#c89a5e'; g.fillRect(3, y, 10, 1); g.fillStyle = '#a87f48'; }
    return c; })();
  // РУШАЩИЙСЯ МОСТИК: деревянные планки над лавой/пропастью
  T.plank = (() => { const c = c16(), g = c.getContext('2d');
    g.fillStyle = '#5a3f22'; g.fillRect(0, 1, 16, 14);
    g.fillStyle = '#8a6234'; g.fillRect(0, 1, 16, 4);
    g.fillStyle = '#a87f48'; g.fillRect(1, 2, 14, 1);
    g.fillStyle = '#3d2a14'; g.fillRect(0, 12, 16, 3);
    g.fillStyle = '#2a1c0e'; g.fillRect(0, 3, 2, 9); g.fillRect(14, 3, 2, 9);
    g.fillStyle = '#6a4a28'; g.fillRect(4, 6, 8, 1); g.fillRect(7, 9, 5, 1);
    return c; })();
  // ЗВЕЗДА ПЕЧАТИ: предмет неуязвимости
  T.star = (() => { const c = c16(), g = c.getContext('2d');
    g.fillStyle = '#ffd800';
    g.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI/2 + i * Math.PI/5, r = i % 2 ? 3.2 : 7.5;
      const x = 8 + Math.cos(a) * r, y = 8.5 + Math.sin(a) * r;
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.closePath(); g.fill();
    g.fillStyle = '#fff7c0'; g.fillRect(6, 4, 2, 2); g.fillRect(9, 8, 2, 2);
    return c; })();
  return T;
}

/* ---------- ФОНЫ (параллакс, своя сцена на каждую землю) ---------- */
const SKY_CACHE = new Map();      // кеш градиентов неба: создаётся один раз на палитру
function skyGrad(g, pal) {
  let gr = SKY_CACHE.get(pal);
  if (!gr) { gr = g.createLinearGradient(0, 0, 0, CFG.VH);
    gr.addColorStop(0, pal.sky0); gr.addColorStop(1, pal.sky1); SKY_CACHE.set(pal, gr); }
  return gr;
}
function drawBG(g, idx, cam, pal, t) {
  // небо градиентом (из кеша — без createLinearGradient каждый кадр)
  g.fillStyle = skyGrad(g, pal); g.fillRect(0, 0, CFG.VW, CFG.VH);
  const ox = cam * 0.4, ox2 = cam * 0.7;
  if (idx === 0) { // ОПЛАКАННЫЕ ХОЛМЫ: облака + холмы + падающие листья
    g.fillStyle = 'rgba(255,255,255,.9)';
    for (let i = 0; i < 8; i++) { const x = ((i * 260 + hash(i) * 120 - ox) % (CFG.VW + 240) + CFG.VW + 240) % (CFG.VW + 240) - 120, y = 24 + hash(i * 3) * 60;
      g.fillRect(x, y, 34, 10); g.fillRect(x + 8, y - 6, 22, 8); g.fillRect(x + 16, y - 10, 12, 6); }
    g.fillStyle = pal.hill;
    for (let i = 0; i < 10; i++) { const x = ((i * 190 + hash(i * 7) * 90 - ox2) % (CFG.VW + 200) + CFG.VW + 200) % (CFG.VW + 200) - 100;
      const h = 40 + hash(i * 11) * 46; g.beginPath(); g.arc(x, 288, h, Math.PI, 0); g.fill(); }
    for (let i = 0; i < 14; i++) { const yy = (t * 26 + hash(i) * 288) % 300, xx = (hash(i * 7) * CFG.VW + Math.sin(t * 1.4 + i) * 26) | 0;
      g.fillStyle = i % 3 ? 'rgba(216,120,40,.75)' : 'rgba(200,60,40,.7)';
      g.fillRect(xx, yy, 3, 2); }
  } else if (idx === 1) { // ЭХО-КАТАКОМБЫ: сталактиты + кристаллы + споры
    g.fillStyle = pal.hill;
    for (let i = 0; i < 22; i++) { const x = ((i * 90 - ox) % (CFG.VW + 90) + CFG.VW + 90) % (CFG.VW + 90) - 45, h = 20 + hash(i * 5) * 70;
      g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 14, 0); g.lineTo(x + 7, h); g.fill(); }
    for (let i = 0; i < 14; i++) { const x = ((i * 130 + 40 - ox2) % (CFG.VW + 130) + CFG.VW + 130) % (CFG.VW + 130) - 60;
      const yy = 150 + hash(i * 9) * 90, hh = 10 + hash(i) * 16;
      g.fillStyle = 'rgba(122,184,255,.5)'; g.fillRect(x, yy, 4, hh);
      g.fillStyle = 'rgba(200,235,255,.8)'; g.fillRect(x + 1, yy + 2, 2, 5); }
    for (let i = 0; i < 12; i++) { const yy = 288 - (t * 14 + hash(i) * 288) % 288, xx = (hash(i * 3) * CFG.VW + Math.sin(t + i * 2) * 12) | 0;
      g.fillStyle = 'rgba(122,184,255,.35)'; g.fillRect(xx, yy, 2, 2); }
  } else if (idx === 2) { // ПАРЯЩИЕ ОСТРОВА: солнце + острова + стаи птиц
    g.fillStyle = '#fff3b0'; g.beginPath(); g.arc(430, 54, 26, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,255,255,.75)';

 "theme": 4, "seed": 55, "sky0": "#140824", "sky1": "#341654", "hill": "#241040", "accent": "#b08aff", "grass": "#4a3a6a", "grassHi": "#6a5a8a", "soil": "#3a2a54", "soilDark": "#241640", "brick": "#5a4a7a", "brickHi": "#8a7ab8", "brickLo": "#342448", "stone": "#4a3a6a", "stoneHi": "#6a5a92", "stoneLo": "#2a1a44", "pipe": "#4a3a6a", "pipeHi": "#7a6a9a", "pipeLo": "#2a1a44", "used": "#4a3a6a", "usedHi": "#6a5a92", "usedLo": "#2a1a44", "spikeBase": "#2a1a44"}, {"name": "Сердце Разлома", "theme": 5, "seed": 66, "sky0": "#1c040a", "sky1": "#4a0c14", "hill": "#2a0810", "accent": "#ff7a3a", "grass": "#5a2430", "grassHi": "#7a3444", "soil": "#3a1420", "soilDark": "#240810", "brick": "#6a2430", "brickHi": "#8a4450", "brickLo": "#3a1018", "stone": "#4a2030", "stoneHi": "#6a4050", "stoneLo": "#2a1018", "pipe": "#4a2a3a", "pipeHi": "#7a5a6a", "pipeLo": "#2a1018", "used": "#4a2030", "usedHi": "#6a4050", "usedLo": "#2a1018", "spikeBase": "#2a1018"}];
const STORY = {"worlds": ["Оплаканные Холмы", "Эхо-Катакомбы", "Парящие Острова", "Пепловый Вулкан", "Цитадель Культа", "Сердце Разлома"], "intro": [{"title": "Тихие Лужи. Ночь пепла", "text": "Боб был простым бондарём из деревни Тихие Лужи — пока в одну из ночей не исчезла его невеста Лира, травница и звездочётка. На подоконнике остались её оберег и горстка тёплого пепла."}, {"title": "Дети Пепла", "text": "Старый картограф рассказал Бобу о культе Дракона — «Детях Пепла». Тысячу лет назад кузнецы-Печатающие сковали Пепельного Дракона Вельзарута пятью печатями. Культ ищет их, чтобы пробудить чудовище. А Лира — последний потомок Печатающих: без её крови печати не разрушить."}, {"title": "Карта пяти земель", "text": "Лира оставила Бобу карту пяти земель и записку: «Не ищи меня». Боб свернул карту, перевязал сумку алым шарфом и шагнул навстречу рассвету. Печати должны достаться ему раньше культа."}, {"title": "Пять хранителей", "text": "Каждой землёй владеет Жрец Печати: камень Голгара, сумрак Нокта, вихри Зефиры, пламя Игниса и душа Малхара. Победи всех — и печати твои. Но помни: культ хочет, чтобы печати сошлись в одном месте..."}], "awaken": [{"title": "Алтарь", "text": "Печати сошлись — и вспыхнули белым огнём. Круг ритуала раскрылся: всё это время культ вёл Боба, позволяя собрать печати. Малхар смеялся: «Ты сам принёс ключи, бондарь». Но Боб уже выломал клетку — Лира свободна."}, {"title": "Пробуждение", "text": "Из пепла под цитаделью поднялся ВЕЛЬЗАРУТ. Небо затянуло багровым, земля треснула, и в Сердце Разлома открылась дыра в древнюю жаркую тьму. Лира крикнула: «Печати могут сковать его вновь — но только в самом сердце!»"}, {"title": "Бой на века", "text": "Боб поправил алый шарф, обернулся к Лире и шагнул в Разлом. «Побудешь со мной, Вельзарут. Тысячу лет — так ещё тысячу». Впереди был бой, о котором будут сказывать у костров пять веков подряд."}], "final": ["Дракон рухнул, и печати взмыли в воздух пятью кометами. Свет скрепил его крылья — и Пепельный Дракон рассыпался тёплым пеплом, из которого к рассвету проросли первые за тысячу лет цветы.", "Лира обняла Боба у самого края Разлома. «Ты пришёл», — сказала она. «Ты ждала», — ответил он. Печати вспыхнули, соединились в Звезду Скрепления и ушли высоко в небо — присматривать за миром.", "Говорят, раз в сто лет Звезда опускается к тем, кто идёт за кем-то через пять земель. Легенду о бондаре Бобе рассказывали у костров ещё пятьсот лет спустя.", "СПАСИБО ЗА ИГРУ! Оригинальная история «Super Bob: В поисках Пяти Печатей Дракона». ENTER — сыграть ещё раз."], "cards": [{"title": "Оплаканные Холмы", "text": "Первая земля на пути к культу. Холмы оплакивают ушедших Печатающих, а по тропам уже рыщут ползуны в масках. Боб сжимает оберег Лиры: путь начинается здесь."}, {"title": "Тропа гонцов", "text": "Гонцы культа оставляли на столбах пепельные метки. Боб стирал их на ходу."}, {"title": "Первые маски", "text": "Ползуны в масках рыли холмы в поисках печатей. Копали плохо — Боб мешал."}, {"title": "Старый дуб", "text": "Под старым дубом Лира прятала травы. Дуб указал ветвью на восток."}, {"title": "Броды у переправы", "text": "Броды охраняли щитоносцы культа. Щит, сбитый прыжком, летит далеко."}, {"title": "Курган предков", "text": "В кургане предков-Печатающих ещё теплится старая клятва."}, {"title": "Пепельный ветер", "text": "Ветер принёс запах гари: вулкан недалеко. И запах ещё более старой злобы."}, {"title": "Скалы у брода", "text": "Скалы у брода помнят песни, которых Боб не слышал. Чужие голоса подпевают."}, {"title": "Калитка жнеца", "text": "Калитка жнеца скрипит на все сто ртов культа. Дальше — логово."}, {"title": "Логово Голгара", "text": "Голгар Камнебородый поднимается из земли — медленно, как долг. Печать Земли при нём."}, {"title": "Эхо-Катакомбы", "text": "Катакомбы уходят вглубь на сотню саженей. Здесь культа больше, чем камня, а эхо выдаёт каждый шаг. Печать Тьмы ждёт во тьме."}, {"title": "Ржавые клети", "text": "Клети ржавеют веками — но замки здесь открываются т function starPath(g, cx, cy, R, r, fill) {
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI/2 + i * Math.PI/5, rad = i % 2 ? r : R;
    const x = cx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.closePath(); g.fillStyle = fill; g.fill();
}

/* общий хвост загрузки уровня — и для быстрого, и для медленного пути */
function finishParse(idx) {

  for (const q of L.q.values()) if (q.type === 'coin') L.coinsTotal++;
  L.par = Math.round(clamp(50 + L.W * 0.45, 70, 190)) + (L.boss ? 40 : 0);
  // автосохранение: если в этом уровне уже взята контрольная точка — восстанавливаем
  try { if (L.checkpoint && localStorage.getItem(Save.CPKEY) === String(idx)) L.checkpoint.hit = true; } catch (e) {}

/* ---------- ЗАПЕКАНИЕ СТАТИЧНЫХ ТАЙЛОВ (60 FPS) ----------

   поэтому рисуем их один раз в offscreen-канвас, а в кадре делаем
   один drawImage вместо ~600. Динамика (блоки '?', кирпичи, решётки,

let TILE_LAYER = null;
function bakeTiles() {
  const w = L.W*16, h = L.H*16;

  if (TILE_LAYER.width !== w || TILE_LAYER.height !== h) { TILE_LAYER.width = w; TILE_LAYER.height = h; }
  const g = TILE_LAYER.getContext('2d');
  g.clearRect(0, 0, w, h);
  g.imageSmoothingEnabled = false;
  for (let ty=0; ty<L.H; ty++) for (let tx=0; tx<L.W; tx++) {
    const ch = L.chars[ty*L.W+tx];
    if (ch==='#') g.drawImage(solidAbove(tx,ty) ? TILES.ground : TILES.groundTop, tx*16, ty*16);
    else if (ch==='X') g.drawImage(TILES.stone, tx*16, ty*16);
    else if (ch==='^') g.drawImage(TILES.spike, tx*16, ty*16);
    else if (ch==='H') g.drawImage(TILES.ladder, tx*16, ty*16);
    else if (ch==='(') g.drawImage((solidAbove(tx,ty)||pipeAbove(tx,ty))?TILES.pipeL:TILES.pipeTL, tx*16, ty*16);
    else if (ch===')') g.drawImage((solidAbove(tx,ty)||pipeAbove(tx,ty))?TILES.pipeR:TILES.pipeTR, tx*16, ty*16);
    else if (ch==='|') { const prev = L.chars[ty*L.W+tx-1];

}
function tileAt(px, py) {                 // тайл в пиксельной точке

  if (y<0 || y>=L.H) return 0;

function charAtPx(px, py) {               // символ карты в пиксельной точке

const P = { x:0,y:0,w:10,h:14, vx:0,vy:0, big:false, grounded:false, face:1,

function updatePlayer(dt) {

const boxAtPx = (px, py) => {         // камень, занимающий пиксельную точку

function pushBoxes(dt) {              // Боб упёрся в камень — камень едет (медленней бегуна)

  if (P.hitWall !== dir) return;      // упор в стену/камень на прошлом проходе
  // тайл, в который упёрся Боб

  const y0 = Math.floor((P.y + 3) / 16), y1 = Math.floor((P.y + P.h - 3) / 16);

  if (!tb) return;                    // упёрся в обычную стену — не камень
  const oldX = tb.x;

    if (o === tb) continue;

/* ---------- АТМОСФЕРНЫЕ ЧАСТИЦЫ (у каждой земли своя погода) ---------- */
const AMB_STYLE = [
  { cols:['rgba(216,120,40,.75)','rgba(200,60,40,.6)','rgba(230,170,60,.7)'], vy:[26,44], dir:-24 }, // листья
  { cols:['rgba(122,184,255,.4)','rgba(200,235,255,.45)'], vy:[-22,-12], dir:8 },                     // споры вверх
  { cols:['rgba(255,255,255,.5)','rgba(255,243,176,.45)'], vy:[10,18], dir:-12 },                     // облёточки
  { cols:['rgba(255,122,42,.7)','rgba(255,200,60,.65)'], vy:[-34,-18], dir:10 },                      // искры вверх
  { cols:['rgba(176,138,255,.4)','rgba(90,70,120,.55)'], vy:[16,30], dir:-10 },                       // пепел культа
  { cols:['rgba(255,90,50,.6)','rgba(255,150,60,.5)'], vy:[-40,-22], dir:12 }                         // жар Разлома
];
function updateAmbient(dt) {
  const st = AMB_STYLE[L.theme] || AMB_STYLE[0];
  if (L.amb.length < 34 && Math.random() < dt*7) {
    L.amb.push({ x: camX + Math.random()*(CFG.VW+40) - 20, y: st.vy[0] < 0 ? L.H*16 - 6 : -8,
      vx: st.dir*(0.6+Math.random()*0.8), vy: st.vy[0] + Math.random()*(st.vy[1]-st.vy[0]),
      t: 0, sway: Math.random()*6.28, col: st.cols[(Math.random()*st.cols.length)|0] });
  }
  for (let i=L.amb.length-1; i>=0; i--) { const a = L.amb[i];
    a.t += dt; a.x += a.vx*dt + Math.sin(a.t*2 + a.sway)*22*dt; a.y += a.vy*dt;
    if (a.y < -14 || a.y > L.H*16 + 14 || a.x < camX - 60 || a.x > camX + CFG.VW + 60) L.amb.splice(i,1); }
}

/* ---------- ОБНОВЛЕНИЕ МИРА ---------- */
function updateWorld(dt) {
  gTime += dt;
  if (G.flagT != null && G.flagT < 1) G.flagT = Math.min(1, G.flagT + dt/1.3);  // спуск полотнища — ровно один раз
  if (shakeT > 0) { shakeT -= dt; if (shakeT <= 0) shakeA = 0; }
  if (G.state === 'play') {
    G.timeLeft -= dt;
    G.lvlTime += dt;                   // статистика для звёзд и итогов уровня
    if (G.timeLeft < 60 && !G.hurry) { G.hurry = true; Sfx.hurt(); note('ВРЕМЯ НА ИСХОДЕ!'); }
    if (G.timeLeft <= 0) { G.timeLeft = 0; killPlayer(); }
    // вступление босса: рёв + баннер с именем хранителя
    if (L.bossZone && !L.bossSeen && P.x + P.w/2 > L.bossZone.a - 60) {
      L.bossSeen = true; G.bossBannerT = 3.4; shake(3, 0.5); Sfx.roar();
    }
  }
  if (G.bossBannerT > 0) G.bossBannerT -= dt;
  // платформы двигаем ДО игрока: тогда перенос (dx/dy) получается синхронным,
  // без лага в кадр, из-за которого с платформы «сползали» при смене направления
  for (const pl of L.plats) {
    const s = Math.sin(gTime*pl.spd + pl.ph);
    const nx = pl.axis==='m' ? pl.x0 + s*pl.range : pl.x0;
    const ny = pl.axis==='v' ? pl.y0 + s*pl.range : pl.y0;
    pl.dx = nx - pl.x; pl.dy = ny - pl.y; pl.x = nx; pl.y = ny;
  }
  updateBoxes(dt);                     // камни оседают до игрока (он в них упирается)
  ENG.syncBoxes(L.boxes);              // позиции камней — в движок (для solid-запросов)
  updatePlayer(dt);
  updatePlates();                      // кнопки/решётки/ключи/замки
  updatePlanks(dt);
  updateKeysLocks();
  updateEnemies(dt);
  updateItems(dt);
  updateFireballs(dt);
  updateAmbient(dt);
  ENG.fxStep(dt);                       // частицы: C++/WASM bobfx (SoA-пул, ноль аллокаций)
  for (let i=L.floats.length-1; i>=0; i--) { const f=L.floats[i]; f.t+=dt; f.y-=30*dt;
    if (f.t>0.8) L.floats.splice(i,1); }
  // монеты (сбор — без аллокаций прямоугольников в петле); МАГНИТ тянет монеты, ТАЛИСМАН удваивает
  const _ch = { x:0, y:0, w:10, h:14 };
  const magnet = Bank.magnet(), amul = Bank.amulet();
  const pcx = P.x + P.w/2, pcy = P.y + P.h/2;
  for (const c of L.coins) {
    if (c.taken) continue;
    if (magnet) {
      const dx = pcx - (c.x+5), dy = pcy - (c.y+7), d2 = dx*dx + dy*dy;
      if (d2 < 5184 && d2 > 1) {            // радиус 72 px: скорость растёт при сближении
        const d = Math.sqrt(d2), sp = (150 + (72 - d) * 2.2) * dt;
        c.x += dx/d * sp; c.y += dy/d * sp;
      }
    }
    _ch.x = c.x; _ch.y = c.y;
    if (!aabb(playerRect(), _ch)) continue;
    c.taken = true; G.coins++; Bank.earn(amul ? 2 : 1); addScore(CFG.SCORE.coin, c.x-2, c.y-8); Sfx.coin();
    for (let i=0;i<3;i++) L.parts.push({x:c.x+5,y:c.y+7,vx:(Math.random()-.5)*80,vy:-40-Math.random()*50,
      t:0,life:0.35,col:'spark',s:2,grav:0.2});
  }
  // камера
  const target = clamp(P.x - CFG.VW*0.38, 0, L.W*16 - CFG.VW);
  camX = Math.abs(target-camX)>1 ? lerp(camX, target, 0.14) : target;
}
/* ---------- ИТОГИ УРОВНЯ: звёзды и рекорды ----------
   ★ — прошёл уровень; ★★ — без смертей; ★★★ — в пределах целевого времени */
function fmtT(s) { s = Math.max(0, Math.round(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
function finishLevel() {
  if (G.recorded) return;
  G.recorded = true;
  const stars = 1 + (G.lvlDeaths === 0 ? 1 : 0) + (G.lvlTime <= L.par ? 1 : 0);
  const old = Prog.get(G.level);
  Prog.record(G.level, stars, G.lvlTime);
  Bank.flush();
  const rec = Prog.get(G.level);
  G.resStars = rec.s;
  G.resNew = !old || rec.s > old.s || (rec.t !== undefined && rec.t === G.lvlTime && (!old.t || G.lvlTime < old.t));
}
function levelCleared() { // вызывается после прогулки от знамени (печати дают только боссы)
  G.clearPhase = 2; G.clearT = 0;
  finishLevel();
  Save.write();
}

/* ============================================================
   ВРАГИ: ползуны-послушники, щитоносцы, тени и ХРАНИТЕЛИ ПЕЧАТЕЙ.
   Пять хранителей (по одному на землю) + Пепельный Дракон в финале.
   Активируются при входе в зону камеры. Урон — по правилам героя.
   ============================================================ */
const BOSS_KINDS = {
  cult:   { hp:5, w:28, h:26, spd:44, jumpV:330, fireT:1.7, fireSpd:132 },
  dragon: { hp:8, w:32, h:26, spd:58, jumpV:430, fireT:1.15, fireSpd:172 }
};
/* имена для баннера вступления (индекс = земля, 5 — дракон) */
const BOSS_INFO = [
  'ГОЛГАР КАМНЕБОРОДЫЙ · ПЕЧАТЬ ЗЕМЛИ',
  'НОКТ, ПАСТЫРЬ ТЕНЕЙ · ПЕЧАТЬ ТЬМЫ',
  'ЗЕФИРА, ДЕВА ВИХРЕЙ · ПЕЧАТЬ НЕБА',
  'ИГНИС, ПЕПЕЛЬНЫЙ КОЛОСС · ПЕЧАТЬ ОГНЯ',
  'ВЕРХОВНЫЙ ЖРЕЦ МАЛХАР · ПЕЧАТЬ ДУШИ',
  'ВЕЛЬЗАРУТ, ПЕПЕЛЬНЫЙ ДРАКОН'
];
function mkEnemy(type, x, y, kind) {
  const base = {type, x, y, vx:0, vy:0, dir:-1, t:0, dead:0, active:false, hitWall:0};
  if (type==='crawler')  Object.assign(base, {w:14, h:12, vx:-CFG.ENEMY.crawler});
  if (type==='shielder') Object.assign(base, {w:14, h:11, vx:-CFG.ENEMY.shielder, state:'walk'});
  if (type==='shade')    Object.assign(base, {w:14, h:8, vx:-CFG.ENEMY.flyerSpd, baseY:y, state:'fly'});
  if (type==='boss') {
    const k = BOSS_KINDS[kind || 'cult'];
    Object.assign(base, {w:k.w, h:k.h, hp:k.hp, kind: kind || 'cult',
                         jumpT:2.4, fireT:1.6, flash:0, state:'fight', minX:0, maxX:99999});
  }
  return base;
}
function updateEnemies(dt) {
  for (let i=L.enemies.length-1; i>=0; i--) {
    const e = L.enemies[i];
    if (!e.active) { // активация в зоне камеры (босс всегда активен в своей арене)
      if (e.type === 'boss' || (e.x < camX + CFG.VW + 48 && e.x > camX - 48)) e.active = true; else continue;
    }
    e.t += dt;
    if (e.dead) {
      if (e.dead === 'flip') { e.vy += 900*dt; e.x += e.vx*dt; e.y += e.vy*dt; } // улетает вниз
      if (e.t > (e.dead==='squish' ? 0.5 : 1.4)) L.enemies.splice(i,1);
      continue;
    }
    if (e.type === 'crawler') { stepWalker(e, dt); }
    else if (e.type === 'shielder') {
      if (e.state === 'walk') stepWalker(e, dt);
      else if (e.state === 'shell') { e.vx = 0; stepGravity(e, dt); }
      else if (e.state === 'spin') { e.vx = CFG.ENEMY.shell * e.dir; stepGravity(e, dt);
        for (const o of L.enemies) if (o !== e && o.type !== 'boss' && !o.dead && o.active && aabb(e, o)) {
          o.dead = 'flip'; o.t = 0; o.vy = -220; addScore(CFG.SCORE.shell, o.x, o.y-8); Sfx.stomp(); }
        // ХРАНИТЕЛЬ ПЕЧАТИ неуязвим для панцирей: щит отскакивает, урон — только прыжок по макушке
        for (const o of L.enemies) if (o !== e && o.type === 'boss' && !o.dead && aabb(e, o)) {
          e.dir = -e.dir; e.x += e.dir * 6; e.vx = CFG.ENEMY.shell * e.dir;
          Sfx.bump(); puff(o.x + o.w/2, o.y + 8, 3, 50); break; } }
    }
    else if (e.type === 'shade') {
      e.x += e.vx*dt; const y0 = Math.floor((e.y+4)/16);
      const tx = Math.floor((e.vx>0 ? e.x+e.w : e.x)/16);
      if (tileAt(tx*16+8, y0*16+8)===1) { e.vx = -e.vx; e.dir = Math.sign(e.vx); }
      e.y = e.baseY + Math.sin(e.t*2.4)*CFG.ENEMY.flyerAmp;
    }
    else if (e.type === 'boss') updateBoss(e, dt);
    contactPlayer(e, i);
  }
}
function stepWalker(e, dt) { // ползун/щитоносец: ходьба + гравитация
  e.vx = Math.abs(e.vx || 20) * (e.dir || -1);
  stepGravity(e, dt);
}
function stepGravity(e, dt) {
  e.vy = Math.min(e.vy + CFG.GRAV*dt, CFG.MAXFALL);
  moveX(e, dt);
  if (e.hitWall) { e.dir = -e.hitWall; e.vx = Math.abs(e.vx) * e.dir; }
  moveY(e, dt);
  // ходячие не падают с уступов (так уровни читаются лучше)
  if (e.grounded && (e.type==='crawler' || (e.type==='shielder' && e.state==='walk'))) {
    const aheadX = e.dir>0 ? e.x+e.w+2 : e.x-2;
    if (!solidPx(aheadX, e.y+e.h+4) && tileAt(aheadX, e.y+e.h+4)!==2 && tileAt(aheadX, e.y+e.h+4)!==3) e.dir = -e.dir;
  }
}
function contactPlayer(e, idx) {
  if (P.dying || e.dead) return;
  if (!aabb(playerRect(), e)) return;
  const stomp = P.vy > 40 && (P.y + P.h) - e.y < 12;
  if (e.type === 'boss') { if (P.starT <= 0) bossContact(e, stomp); return; } // звезда: босс безвреден
  if (P.starT > 0) {  // звезда печати: враг гибнет от одного касания
    e.dead = 'flip'; e.t = 0; e.vy = -220;
    addScore(CFG.SCORE.stomp, e.x, e.y-8); Sfx.stomp();
    L.parts.push({x:e.x+7, y:e.y+4, vx:0, vy:-40, t:0, life:0.35, col:'spark', s:3, grav:0.3});
    return;
  }
  if (stomp) {
    P.vy = Keys.jump ? -CFG.STOMPV - 60 : -CFG.STOMPV;
    P.squash = 0.14;
    addScore(CFG.SCORE.stomp, e.x, e.y-8); Sfx.stomp();
    L.parts.push({x:e.x+7, y:e.y+e.h-2, vx:0, vy:-30, t:0, life:0.3, col:'puff', s:3, grav:0});
    if (e.type==='crawler') { e.dead='squish'; e.t=0; }
    else if (e.type==='shielder') {
      if (e.state==='walk') { e.state='shell'; e.h=8; e.y += 3; Sfx.stomp(); }
      else if (e.state==='spin') { e.state='shell'; e.vx=0; }
      else { e.state='spin'; e.dir = P.x+P.w/2 < e.x+7 ? 1 : -1; }
    }
    else if (e.type==='shade') { e.dead='flip'; e.t=0; e.vy=-200; }
  } else {
    if (e.type==='shielder' && e.state==='shell') { // пинаем щит
      e.state='spin'; e.dir = (P.x+P.w/2 < e.x+7) ? 1 : -1; e.x += e.dir*4;
      addScore(CFG.SCORE.stomp, e.x, e.y-8); Sfx.stomp(); return;
    }
    hurtPlayer();
  }
}
/* ---------- ХРАНИТЕЛИ ПЕЧАТЕЙ ---------- */
function updateBoss(b, dt) {
  if (b.dead) { b.vy += CFG.GRAV*dt; b.y += b.vy*dt; b.t += dt; return; }
  b.flash -= dt;
  const k = BOSS_KINDS[b.kind];
  let speed = k.spd + (k.hp - b.hp) * 7;                 // злее с каждой раной
  let fireGap = k.fireT;
  if (b.kind === 'dragon' && b.hp <= 3) { speed *= 1.25; fireGap *= 0.68; } // ярость дракона
  // патрулирование арены туда-сюда (честно читается игроком)
  if (b.x <= L.bossZone.a) b.dir = 1;
  if (b.x + b.w >= L.bossZone.b) b.dir = -1;
  b.vx = speed * b.dir;
  if (b.x < L.bossZone.a) { b.x = L.bossZone.a; }
  if (b.x + b.w > L.bossZone.b) { b.x = L.bossZone.b - b.w; }
  b.vy = Math.min(b.vy + CFG.GRAV*dt, CFG.MAXFALL);
  moveX(b, dt); moveY(b, dt);
  if (L.bossFloor != null && b.y + b.h > L.bossFloor) { b.y = L.bossFloor - b.h; b.vy = 0; b.grounded = true; }
  b.jumpT -= dt;
  if (b.jumpT <= 0 && b.grounded) {
    b.vy = -k.jumpV; b.jumpT = (b.kind==='dragon' ? 1.8 : 2.2) + Math.random()*1.6;
    shake(1.6, 0.2);                                     // тяжёлый прыжок босса
  }
  b.fireT -= dt;
  const pc = P.x + P.w/2, bc = b.x + b.w/2;
  if (b.fireT <= 0 && b.grounded && Math.abs(pc-bc) < 260) {
    b.fireT = fireGap + Math.random()*1.2;
    const fdir = pc < bc ? -1 : 1;               // пламя всегда в сторону Боба
    const shots = b.kind === 'dragon' ? 2 : 1;   // дракон дышит веером
    for (let s=0; s<shots; s++) {
      const vy = shots === 1 ? Math.sin(b.t*3)*20 : (s === 0 ? -46 : 46);
      L.fireballs.push({x: b.x + (fdir<0?-4:b.w), y: b.y+8 + s*2, w:8, h:8,
        vx: k.fireSpd * fdir, vy, t:0});
    }
    Sfx.fire();
  }
}
function bossContact(b, stomp) {
  if (b.dead) return;
  if (stomp && b.flash <= 0) {
    b.hp--; b.flash = 0.8; P.vy = -CFG.STOMPV - 120; P.inv = 1.2; // неуязвимость на время отскока
    addScore(1000, b.x, b.y-10); Sfx.bossHit(); shake(2.5, 0.25);
    for (let i=0;i<10;i++) L.parts.push({x:b.x+b.w/2, y:b.y+4, vx:(Math.random()-0.5)*160,
      vy:-Math.random()*160, t:0, life:0.6, col:'fire', s:3, grav:0.6});
    if (b.hp <= 0) { // хранитель повержен!
      b.dead = 'flip'; b.t = 0; b.vy = -260; L.fireballs.length = 0;
      try { localStorage.removeItem(Save.CPKEY); } catch (e) {}  // чекпоинт отработал
      addScore(CFG.SCORE.boss, b.x, b.y-20); Sfx.fanfare(); shake(4, 0.6);
      finishLevel();
      Save.write();
      if (G.level >= LAST) { // дракон: игра пройдена — кампания завершена
        Save.clear();
        setTimeout(() => { if (G.state==='play') { G.state='final'; Sfx.stopMusic(); } }, 2600);
      } else {            // печать земли переходит к Бобу
        const wi = Math.min(4, Math.floor(G.level/10));
        if (!G.seals[wi]) { G.seals[wi] = true; addScore(CFG.SCORE.seal, b.x+6, b.y-36);
          G.sealFly = {x:b.x+6, y:b.y-36, t:0}; }
        setTimeout(() => { if (G.state==='play') { G.state='clear'; G.clearPhase=3; G.clearT=0; Sfx.stopMusic(); } }, 2600);
      }
    }
  } else if (b.flash <= 0) hurtPlayer();
}
/* ---------- ПРЕДМЕТЫ И СНАРЯДЫ ---------- */
function updateItems(dt) {
  for (let i=L.items.length-1; i>=0; i--) {
    const it = L.items[i]; it.t = (it.t||0)+dt;
    if (it.rise > 0) { it.rise -= dt; it.y -= 26*dt; continue; } // выход из блока
    it.vy = Math.min(it.vy + CFG.GRAV*dt, CFG.MAXFALL);
    moveX(it, dt); if (it.hitWall) { it.vx = -it.vx; it.hitWall = 0; }
    moveY(it, dt);
    if (it.y > L.H*16+40) { L.items.splice(i,1); continue; }
    if (aabb(playerRect(), it)) {
      if (it.type === 'star') activateStar(it.x, it.y);   // звезда неуязвимости
      else growPlayer();
      L.items.splice(i,1);
    }
  }
}
function updateFireballs(dt) {
  for (let i=L.fireballs.length-1; i>=0; i--) {
    const f = L.fireballs[i]; f.t += dt;
    f.x += f.vx*dt; f.y += f.vy*dt + Math.sin(f.t*10)*0.5;
    if (solidPx(f.x+4, f.y+4) || f.x < camX-40 || f.x > camX+CFG.VW+40 || f.y > L.H*16) { L.fireballs.splice(i,1); continue; }
    if (!P.dying && aabb(playerRect(), f)) { L.fireballs.splice(i,1);
      if (P.starT > 0) { addScore(200, f.x, f.y-8); puff(f.x+4, f.y+4, 4, 40); } // звезда глотает пламя
      else hurtPlayer(); }
  }
}

/* ============================================================
   РЕНДЕР и ЭКРАНЫ: тайлы, фоны, HUD, титры/интро/карточки/финал,

const cv2 = cv.getContext('2d');
cv2.imageSmoothingEnabled = false;

/* кеш шрифта канваса: cv2.font задаём только при смене размера (минус тысячи присвоений строк в секунду) */
let _fontSz = -1;
function setFont(sz) { if (_fontSz !== sz) { cv2.font = `bold ${sz}px "Courier New", monospace`; _fontSz = sz; } }

/* тач-устройство? (кнопки, полный экран, подсказка на титуле) */
const IS_TOUCH = matchMedia('(pointer: coarse)').matches;

/* отступы экрана (вырез/скругления) в пикселях канваса — чтобы HUD не подрезался краями */
const _safe = { l:0, r:0, t:0 };
function readSafeArea() {
  try {
    const cs = getComputedStyle(document.getElementById('safeProbe'));
    const px = v => (parseFloat(v) || 0);
    const sx = CFG.VW / Math.max(1, innerWidth), sy = CFG.VH / Math.max(1, innerHeight);
    _safe.l = Math.min(40, px(cs.paddingLeft) * sx);
    _safe.r = Math.min(40, px(cs.paddingRight) * sx);
    _safe.t = Math.min(40, px(cs.paddingTop) * sy);
  } catch (e) {}
}

/* ПОЛНЫЙ ЭКРАН БЕЗ ПОЛОС: высота мира 288 px всегда (физика не меняется),
   а ширина вида подгоняется под аспект экрана — на широких экранах видно больше уровня */
function fitCanvas() {
  const vw = clamp(Math.round(CFG.VH * innerWidth / Math.max(1, innerHeight)), 432, 960);
  if (vw !== CFG.VW) {
    CFG.VW = vw; cv.width = vw; cv.height = CFG.VH;
    cv2.imageSmoothingEnabled = false;   // смена размера сбрасывает контекст
    _fontSz = -1;                        // …в том числе шрифт — сбрасываем кеш
  }
  readSafeArea();
}
addEventListener('resize', fitCanvas);
addEventListener('orientationchange', () => setTimeout(fitCanvas, 150));
fitCanvas();

function txt(s, x, y, size=8, col='#fff', align='left', shadow=true) {
  setFont(size);
  cv2.textAlign = align; cv2.textBaseline = 'top';
  x = Math.round(x); y = Math.round(y);          // целые пиксели — без «размытых» строк
  if (shadow) { cv2.fillStyle = 'rgba(4,6,14,.85)'; cv2.fillText(s, x+1, y+1); cv2.fillText(s, x, y+1); }
  cv2.fillStyle = col; cv2.fillText(s, x, y);
}
function outlineTxt(s, x, y, size, col, align='center') { // текст с контуром — для логотипа
  setFont(size);
  cv2.textAlign = align; cv2.textBaseline = 'top';
  x = Math.round(x); y = Math.round(y);
  cv2.fillStyle = 'rgba(4,6,14,.9)';
  cv2.fillText(s, x+2, y+2); cv2.fillText(s, x-2, y+2); cv2.fillText(s, x+2, y-2); cv2.fillText(s, x-2, y-2);
  cv2.fillText(s, x+2, y); cv2.fillText(s, x-2, y); cv2.fillText(s, x, y+2); cv2.fillText(s, x, y-2);
  cv2.fillStyle = col; cv2.fillText(s, x, y);
}
function wrap(s, x, y, maxW, lh=11, size=8, col='#fff') {
  const words = s.split(' '); let line = '';
  for (const w of words) {
    const t = line ? line+' '+w : w;
    setFont(size);
    if (cv2.measureText(t).width > maxW && line) { txt(line, x, y, size, col); line = w; y += lh; }
    else line = t;
  }
  if (line) txt(line, x, y, size, col);
  return y + lh;
}
function inRect(mx, my, r) { return r && mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h; }
/* печатающийся текст: показываем первые t*60 символов + курсор */
function revealed(s, t, cps = 60) {
  const n = Math.min(s.length, Math.floor(t * cps));
  return s.slice(0, n) + (n < s.length ? '_' : '');
}
const worldOf = i => Math.min(5, Math.floor(i / 10));          // земля уровня (0..5)
const SEALS_RU = ['ЗЕМЛИ', 'ТЬМЫ', 'НЕБА', 'ОГНЯ', 'ДУШИ'];

/* ---------- РЕНДЕР МИРА ---------- */
function renderWorld() {
  const pal = L.pal, T = TILES;
  drawBG(cv2, L.theme, camX, pal, gTime);
  // цитадель-башня у финиша
  if (L.castleX >= 0) drawCastle(L.castleX*16, 288 - 5*16, pal);
  if (L.flagX >= 0) drawFlag(L.flagX*16+8, L.flagTop*16, pal);
  if (L.checkpoint) drawCheckpoint(L.checkpoint);
  if (L.bossZone) { // декорация в конце арены: печать на пьедестале / клетка / Разлом
    if (L.idx === LAST - 1) drawCage(L.bossZone.b + 8);
    else if (L.idx === LAST) drawRift(L.bossZone.b + 8);
    else drawGate(L.bossZone.b + 8);
  }
  // статичные тайлы — один blit запечённого слоя вместо сотен drawImage за кадр
  if (TILE_LAYER) {
    const sx = Math.max(0, Math.min(TILE_LAYER.width - CFG.VW, Math.round(camX)));
    const sw = Math.min(CFG.VW, TILE_LAYER.width - sx);
    if (sw > 0) cv2.drawImage(TILE_LAYER, sx, 0, sw, L.H*16, 0, 0, sw, L.H*16);
  }
  // динамичные тайлы (блоки '?', кирпичи, решётки, мостики, лава, замки) + тряска блоков
  const x0 = Math.max(0, Math.floor(camX/16)-1), x1 = Math.min(L.W-1, Math.ceil((camX+CFG.VW)/16)+1);
  for (let ty=0; ty<L.H; ty++) for (let tx=x0; tx<=x1; tx++) {
    const ch = L.chars[ty*L.W+tx];
    if (ch==='.' || ch==='#' || ch==='X' || ch==='^' || ch==='H' || ch==='(' || ch===')' || ch==='|') continue;
    const q = (ch==='B' || ch==='?' || ch==='M') ? L.q.get(tx+','+ty) : null;
    const bump = q && q.bumpT>0 ? -Math.sin(q.bumpT/0.18*Math.PI)*5 : 0;
    if (q && q.bumpT>0) q.bumpT -= 1/60;
    const dx = tx*16 - camX, dy = ty*16 + bump;
    switch (ch) {
      case 'B': cv2.drawImage(T.brick, dx, dy); break;
      case '?': case 'M': cv2.drawImage(T.q, dx, dy); break;
      case 'U': cv2.drawImage(T.used, dx, dy); break;
      case 'L': cv2.drawImage(T.lava[Math.floor(gTime*6)%2], dx, dy); break;
      case 'W': { const pk = L.plankMap.get(ty*L.W+tx);   // рушащийся мостик: трясётся перед падением
        const jx = pk && pk.st === 1 ? Math.round(Math.sin(pk.t*46)*1.6) : 0;
        cv2.drawImage(T.plank, dx + jx, dy); break; }
      case 'D': if (L.grid[ty*L.W+tx] === 1) cv2.drawImage(T.gate, dx, dy);
        else { cv2.globalAlpha = .16; cv2.drawImage(T.gate, dx, dy); cv2.globalAlpha = 1; } break;
      case 'J': cv2.drawImage(T.lock, dx, dy); break;
    }
  }
  // движущиеся платформы (только видимые)
  for (const pl of L.plats) {
    if (pl.x + pl.w < camX || pl.x > camX + CFG.VW) continue;
    cv2.fillStyle = pal.accent; cv2.fillRect(pl.x-camX, pl.y, pl.w, pl.h);
    cv2.fillStyle = 'rgba(0,0,0,.35)'; cv2.fillRect(pl.x-camX, pl.y+pl.h-2, pl.w, 2);
    cv2.fillStyle = 'rgba(255,255,255,.5)'; cv2.fillRect(pl.x-camX+2, pl.y+1, pl.w-4, 1);
  }
  // головоломки: кнопки, ключи, толкаемые камни (только видимые)
  for (const pl of L.plates) { if (pl.tx*16 < camX-16 || pl.tx*16 > camX+CFG.VW) continue;
    cv2.drawImage(pl.pressed ? T.plate1 : T.plate0, pl.tx*16-camX, pl.ty*16); }
  for (const k of L.keys) { if (k.taken || k.x < camX-16 || k.x > camX+CFG.VW) continue;
    cv2.drawImage(T.key, Math.round(k.x-camX), Math.round(k.y + Math.sin(gTime*3+k.ph)*2)); }
  for (const b of L.boxes) { if (b.x + b.w < camX || b.x > camX + CFG.VW) continue;
    cv2.drawImage(T.pushBox, Math.round(b.x-camX), Math.round(b.y)); }
  // монеты (только видимые)
  const cf = [SPR.coin0, SPR.coin1, SPR.coin2, SPR.coin1][Math.floor(gTime*8)%4];
  for (const c of L.coins) { if (c.taken || c.x < camX-16 || c.x > camX+CFG.VW) continue;
    cv2.drawImage(cf, c.x-camX, c.y); }
  // предметы (амулет мощи и звезда печати)
  for (const it of L.items) { if (it.x < camX-16 || it.x > camX+CFG.VW) continue;
    it.type === 'star'
      ? cv2.drawImage(TILES.star, it.x-camX, it.y + Math.sin(gTime*3.2 + (it.ph||0))*2)
      : cv2.drawImage(SPR.charm, it.x-camX, it.y); }
  // атмосферные частицы (погода земли)
  for (const a of L.amb) { if (a.x < camX-4 || a.x > camX+CFG.VW) continue;
    cv2.fillStyle = a.col; cv2.fillRect(a.x-camX, a.y, 3, 3); }
  // враги (только видимые; босс широкий — запас 48)
  for (const e of L.enemies) { if (e.x + e.w < camX - 48 || e.x > camX + CFG.VW + 48) continue;
    drawEnemy(e); }
  // пламя боссов
  for (const f of L.fireballs) { if (f.x < camX-8 || f.x > camX+CFG.VW) continue;
    cv2.drawImage(Math.floor(f.t*12)%2 ? SPR.fire1 : SPR.fire0, f.x-camX, f.y); }
  drawPlayer();
  // частицы (только видимые)
  { // частицы из пула движка (bobfx): чтение прямо из памяти WASM
    const n = ENG.fxCount(), fxx = ENG.fxX(), fxy = ENG.fxY(), fxt = ENG.fxT(),
          fxl = ENG.fxLife(), fxs = ENG.fxS(), fxc = ENG.fxCol(), fxf = ENG.fxFlags();
    for (let i=0; i<n; i++) {
      const px = fxx[i]; if (px < camX-8 || px > camX+CFG.VW+8) continue;
      if (fxf[i] & 2) { cv2.drawImage(SPR.coin0, px-camX, fxy[i]); continue; }
      cv2.globalAlpha = 1 - fxt[i]/fxl[i];
      cv2.fillStyle = fxc[i]===2 ? pal.brick : fxc[i]===3 ? '#8a6234' :
                      fxc[i]===0 ? '#ffd800' :
                      fxc[i]===1 ? 'rgba(255,255,255,.9)' : '#ff7a2a';
      cv2.fillRect(px-camX, fxy[i], fxs[i], fxs[i]);
      cv2.globalAlpha = 1;
    }
  }
  // всплывающие очки
  for (const f of L.floats) { if (f.x < camX-40 || f.x > camX+CFG.VW+40) continue;
    cv2.globalAlpha = 1-f.t/0.8; txt(f.txt, f.x-camX, f.y-16, 8, '#fff', 'center'); cv2.globalAlpha = 1; }
  // летящая к HUD печать
  if (G.sealFly) drawSealFly();
}
function solidAbove(tx,ty) { if (ty<=0) return false; const i=(ty-1)*L.W+tx;
  return L.grid[i]===1 || L.chars[i]==='(' || L.chars[i]===')'; }  // трубы — тоже «опора» для текстуры
function pipeAbove(tx,ty) { return ty>0 && (L.chars[(ty-1)*L.W+tx]==='(' || L.chars[(ty-1)*L.W+tx]===')'); }
function drawCheckpoint(cp) { // флажок контрольной точки: серый — не взята, золотой — автосейв активен
  const dx = cp.x - camX, gy = cp.y + 16;                 // верх земли под точкой
  cv2.fillStyle = '#8a94a8'; cv2.fillRect(dx+7, gy-44, 2, 44);          // шест
  cv2.fillStyle = '#d8e0ec'; cv2.beginPath(); cv2.arc(dx+8, gy-44, 2.5, 0, 7); cv2.fill(); // набалдашник
  const fy = gy - 42 + (cp.hit ? Math.sin(gTime*4)*1.2 : 0);
  cv2.fillStyle = cp.hit ? '#ffd800' : 'rgba(230,230,240,.4)';
  cv2.beginPath(); cv2.moveTo(dx+9, fy); cv2.lineTo(dx+20, fy+4); cv2.lineTo(dx+9, fy+8); cv2.fill();
  if (cp.hit) {   // печать-маячок над активной точкой
    cv2.globalAlpha = 0.3 + Math.sin(gTime*5)*0.12;
    cv2.drawImage(SPR.seal, dx+3, gy-56, 9, 9); cv2.globalAlpha = 1;
  }
}
function drawFlag(px, topY, pal) {
  const baseY = L.flagBase || L.H*16;          // низ древка — верх земли, а не дно карты
  const dx = px - camX;
  // древко: металлический градиент с бликом
  const pole = cv2.createLinearGradient(dx-1.5, 0, dx+1.5, 0);
  pole.addColorStop(0, '#66748c'); pole.addColorStop(.4, '#f4f7ff'); pole.addColorStop(1, '#8b98b0');
  cv2.fillStyle = pole; cv2.fillRect(dx-1.5, topY, 3, baseY-topY);
  // набалдашник — золотой шар с мягким сиянием и бликом
  const rg = cv2.createRadialGradient(dx-1, topY-3.5, .5, dx, topY-2.5, 4.2);
  rg.addColorStop(0, '#fff6c8'); rg.addColorStop(.55, '#ffd85a'); rg.addColorStop(1, '#c9971c');
  cv2.fillStyle = rg; cv2.beginPath(); cv2.arc(dx, topY-2.5, 3.4, 0, 7); cv2.fill();
  // полотнище спускается по древку ровно ОДИН раз (G.flagT), плавно и не ниже земли
  let fy = topY + 6;
  if (G.flagT != null) {
    const k = Math.min(1, G.flagT), e = 1 - (1-k)*(1-k);          // ease-out
    fy = lerp(topY + 6, Math.max(topY + 6, baseY - 22), e);
  }
  /* ── ТКАНЬ НА ВЕТРУ: бегущая волна — амплитуда растёт от древка к свободному краю,
         гребень бежит вдоль полотна (фаза зависит от расстояния u) ── */
  const W = 26, H = 16, N = 5;                                    // размер ткани и число сегментов
  const wave = u => Math.sin(gTime*5.2 - u*0.55) * 2.2 * Math.pow(u/W, 1.3)
                  + Math.sin(gTime*1.7) * 0.6 * (u/W);           // + лёгкое дыхание всего полотна
  const top = [], bot = [];
  for (let i = 0; i <= N; i++) {
    const u = W*i/N;
    top.push([dx-1-u, fy + wave(u)*(0.55 + 0.45*i/N)]);           // верхняя кромка
    bot.push([dx-1-u, fy + H + wave(u)]);                         // нижняя кромка
  }
  const path = () => {
    cv2.beginPath(); cv2.moveTo(top[0][0], top[0][1]);
    for (let i = 1; i <= N; i++) cv2.lineTo(top[i][0], top[i][1]);
    for (let i = N; i >= 0; i--) cv2.lineTo(bot[i][0], bot[i][1]);
    cv2.closePath();
  };
  cv2.save();
  path(); cv2.clip();                        // всё нарисованное ниже — строго внутри ткани
  cv2.fillStyle = pal.accent; cv2.fillRect(dx-1-W-4, fy-5, W+8, H+10);   // полотно (клип обрежет)
  const sh = cv2.createLinearGradient(0, fy, 0, fy+H);                   // свет сверху, тень снизу
  sh.addColorStop(0, 'rgba(255,255,255,.32)'); sh.addColorStop(.45, 'rgba(255,255,255,0)');
  sh.addColorStop(1, 'rgba(6,8,20,.36)');
  cv2.fillStyle = sh; cv2.fillRect(dx-1-W-4, fy-5, W+8, H+10);
  for (let s = 0; s < 2; s++) {          // складки: бегущие вместе с волной полосы тени
    const yy = fy + H*(0.38 + 0.3*s) + Math.sin(gTime*5.2 - W*(0.4+0.25*s)*0.55)*1.7;
    cv2.fillStyle = 'rgba(6,8,20,.15)'; cv2.fillRect(dx-1-W, yy, W, 1.5);
  }
  // звезда-печать: в центре полотна и смещается вместе с волной — физически не выходит за ткань
  const uc = W*0.52, sc = 9;
  cv2.drawImage(SPR.seal, dx-1-uc-sc/2, fy + H/2 + wave(uc)*0.8 - sc/2, sc, sc);
  cv2.restore();
  path();                                // кайма: тёплая внутренняя + тёмный контур

function drawCastle(x, y, pal) {

function drawGate(x) { // пьедестал с парящей печатью (арена хранителя)
